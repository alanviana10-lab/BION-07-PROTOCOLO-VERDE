   Arquivo único. Módulos: CONFIG, Util, Save, Audio, View/Render, Input,
   Physics, FX, Pools, Player, Enemies, Level, Game, UI.

    runner:  { w: 18, h: 26, hp: 2, speed: 150, triggerDist: 300, windup: 0.35, chargeTime: 1.6, recover: 0.6, contactDmg: 1, score: 150 },
    turret:  { w: 22, h: 22, hp: 5, range: 380, fireRate: 2.6, telegraph: 0.55, burst: 3, burstGap: 0.16, bulletSpeed: 170, bulletLife: 3, turnSpeed: 3, contactDmg: 0, score: 200 }
  },

/* ============================ Util ============================ */
const Util = {
  clamp: (v, a, b) => v < a ? a : (v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  rand: (a, b) => a + Math.random() * (b - a),
  approach(v, t, d) { return v < t ? Math.min(v + d, t) : Math.max(v - d, t); },
  mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
  rr(ctx, x, y, w, h, r) { // roundRect seguro
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  },
  overlap(a, b) { // corpos com x central e y nos pés
    return a.x + a.w / 2 > b.x - b.w / 2 && a.x - a.w / 2 < b.x + b.w / 2 && a.y > b.y - b.h && a.y - a.h < b.y;
  }
};

/* ============================ Save ============================ */
const Save = {
  KEY: 'bion07_protocolo_verde_v1',
  data: null,
  defaults() {
    return { versao: 1, perfil: { id: 'local', nome: 'Jogador' }, recordes: { recruta: 0, veterano: 0, sobrecarga: 0 }, progresso: { faseDesbloqueada: 1 }, config: { mudo: false } };
  },
  load() {
    this.data = this.defaults();
    try {
      const raw = window.localStorage.getItem(this.KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d && d.versao === 1) {
          Object.assign(this.data.perfil, d.perfil || {});
          Object.assign(this.data.recordes, d.recordes || {});
          Object.assign(this.data.progresso, d.progresso || {});
          Object.assign(this.data.config, d.config || {});
        }
      }
    } catch (e) { /* sem storage: segue sem salvar */ }
  },
  write() {
    try { window.localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) { /* ignora */ }
  }
};

/* ============================ Audio ============================ */
const Audio = {
  ctx: null, master: null, sfx: null, noiseBuf: null, voices: 0, muted: false, last: {},
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} } return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : CONFIG.audio.master;
      this.master.connect(this.ctx.destination);
      this.sfx = this.ctx.createGain();
      this.sfx.gain.value = CONFIG.audio.sfx;
      this.sfx.connect(this.master);
      const len = Math.floor(this.ctx.sampleRate * 1.0);
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : CONFIG.audio.master, this.ctx.currentTime, 0.02);
  },
  ok() { return this.ctx && this.ctx.state === 'running' && !this.muted && this.voices < CONFIG.audio.maxVoices; },
  tone(type, f0, f1, dur, vol, delay = 0) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.sfx);
    this.voices++; o.onended = () => { this.voices--; };
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, ftype, f0, f1, delay = 0) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime + delay;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf;
    f.type = ftype; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.sfx);
    this.voices++; s.onended = () => { this.voices--; };
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  },
  play(name) {
    if (!this.ctx) return;
    const now = performance.now();
    const minGap = { shoot: 45, eshot: 60, hit: 35, step: 90, flame: 70, spread: 60, laser: 60, bounce: 50 }[name] || 0;
    if (minGap && this.last[name] && now - this.last[name] < minGap) return;
    this.last[name] = now;
    switch (name) {
      case 'shoot': this.tone('square', 900, 260, 0.07, 0.10); this.noise(0.04, 0.05, 'highpass', 3000, 1500); break;
      case 'eshot': this.tone('sawtooth', 420, 140, 0.14, 0.07); break;
      case 'telegraph': this.tone('sine', 700, 1400, 0.18, 0.05); break;
      case 'hit': this.noise(0.05, 0.10, 'bandpass', 2500, 900); this.tone('square', 300, 160, 0.04, 0.04); break;
      case 'explode': this.noise(0.45, 0.30, 'lowpass', 2200, 80); this.tone('sine', 140, 35, 0.35, 0.28); break;
      case 'jump': this.tone('sine', 260, 620, 0.12, 0.08); break;
      case 'land': this.noise(0.06, 0.05, 'lowpass', 600, 120); break;
      case 'dash': this.noise(0.22, 0.14, 'bandpass', 600, 4000); this.tone('sawtooth', 160, 520, 0.16, 0.05); break;
      case 'hurt': this.tone('square', 240, 70, 0.25, 0.12); this.noise(0.15, 0.12, 'lowpass', 1500, 200); break;
      case 'ui': this.tone('triangle', 660, 990, 0.08, 0.08); break;
      case 'start': this.tone('triangle', 440, 440, 0.1, 0.08); this.tone('triangle', 660, 660, 0.1, 0.08, 0.1); this.tone('triangle', 880, 880, 0.2, 0.09, 0.2); break;
      case 'spread': this.tone('square', 620, 180, 0.1, 0.08); this.noise(0.08, 0.08, 'bandpass', 1800, 600); break;
      case 'laser': this.tone('sawtooth', 1800, 300, 0.14, 0.07); this.tone('sine', 2400, 900, 0.1, 0.05); break;
      case 'flame': this.noise(0.12, 0.09, 'lowpass', 1400, 500); break;
      case 'knife': this.noise(0.12, 0.16, 'highpass', 2000, 6000); this.tone('sawtooth', 900, 2200, 0.08, 0.06); break;
      case 'throw': this.tone('triangle', 300, 180, 0.12, 0.07); break;
      case 'bounce': this.tone('square', 180, 120, 0.05, 0.05); break;
      case 'bigexplode': this.noise(0.7, 0.4, 'lowpass', 3000, 50); this.tone('sine', 110, 25, 0.6, 0.35); break;
      case 'pickup': this.tone('square', 660, 660, 0.06, 0.07); this.tone('square', 990, 990, 0.1, 0.07, 0.06); break;
      case 'weapon': this.tone('sawtooth', 220, 440, 0.15, 0.08); this.tone('square', 440, 880, 0.2, 0.07, 0.12); this.tone('triangle', 880, 1320, 0.25, 0.07, 0.25); break;
      case 'glass': this.noise(0.25, 0.18, 'highpass', 4000, 1500); this.tone('sine', 1800, 1200, 0.2, 0.05); break;
      case 'crate': this.noise(0.18, 0.2, 'bandpass', 800, 200); this.tone('square', 160, 60, 0.12, 0.08); break;
      case 'empty': this.tone('triangle', 400, 200, 0.15, 0.06); break;
      case 'warn': this.tone('square', 880, 880, 0.12, 0.07); this.tone('square', 660, 660, 0.12, 0.07, 0.15); this.tone('square', 880, 880, 0.12, 0.07, 0.3); break;
      case 'heavy': this.noise(0.35, 0.3, 'lowpass', 700, 40); this.tone('sine', 90, 30, 0.3, 0.3); break;
      case 'checkpoint': this.tone('triangle', 523, 523, 0.1, 0.08); this.tone('triangle', 784, 784, 0.18, 0.08, 0.1); break;
      case 'select': this.tone('triangle', 520, 520, 0.05, 0.06); break;
      case 'gameover': this.tone('sawtooth', 330, 320, 0.3, 0.08); this.tone('sawtooth', 262, 250, 0.3, 0.08, 0.3); this.tone('sawtooth', 196, 120, 0.7, 0.09, 0.6); break;
      case 'victory': [523, 659, 784, 1047].forEach((f, i) => this.tone('square', f, f, 0.16, 0.07, i * 0.13)); this.tone('triangle', 1047, 1047, 0.5, 0.08, 0.55); break;
      case 'death': this.tone('sawtooth', 500, 40, 0.9, 0.12); this.noise(0.8, 0.25, 'lowpass', 3000, 60); break;
    }
  }
};

/* ============================ View / Render ============================ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });

const View = {
  W: 1, H: 1, dpr: 1, scale: 1, viewW: 640, gx: 0, gy: 0, gw: 1, gh: 1, portrait: false,
  safe: { t: 0, r: 0, b: 0, l: 0 },
  readSafe() {
    try {
      const cs = getComputedStyle(document.getElementById('sa'));
      this.safe = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
    } catch (e) { this.safe = { t: 0, r: 0, b: 0, l: 0 }; }
  },
  resize() {
    const vv = window.visualViewport;
    const W = Math.max(1, Math.round(vv ? vv.width : window.innerWidth));
    const H = Math.max(1, Math.round(vv ? vv.height : window.innerHeight));
    this.W = W; this.H = H;
    this.dpr = Math.min(CONFIG.render.maxDpr, window.devicePixelRatio || 1);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    canvas.width = Math.round(W * this.dpr); canvas.height = Math.round(H * this.dpr);
    this.readSafe();
    const WH = CONFIG.world.height, cw = CONFIG.world;
    this.portrait = H > W;
    if (!this.portrait) {
      let scale = H / WH, vw = W / scale;
      if (vw > cw.maxW) vw = cw.maxW;
      if (vw < cw.minW) { vw = cw.minW; scale = W / vw; }
      this.scale = scale; this.viewW = vw;
      this.gw = vw * scale; this.gh = WH * scale;
      this.gx = (W - this.gw) / 2; this.gy = (H - this.gh) / 2;
    } else {
      let vw = cw.portraitW, scale = W / vw;
      let gy = this.safe.t, gh = WH * scale;
      const minStrip = 240;
      if (H - gy - gh < minStrip) { gh = Math.max(140, H - gy - minStrip); scale = gh / WH; }
      this.scale = scale; this.viewW = vw;
      this.gw = vw * scale; this.gh = WH * scale;
      this.gx = (W - this.gw) / 2; this.gy = gy;
    }
    UI.layout();
    Render.buildBackgrounds();
  }
};

const Render = {
  TW: 800, bgFar: null, bgMid: null, flies: [], skyGrad: null, groundGrad: null,
  makeLayer(drawFn, seed) {
    const r = Math.min(CONFIG.render.maxBgRes, View.scale * View.dpr);
    const c = document.createElement('canvas');
    c.width = Math.ceil(this.TW * r); c.height = Math.ceil(CONFIG.world.height * r);
    const g = c.getContext('2d');
    g.scale(r, r);
    drawFn(g, Util.mulberry(seed));
    return c;
  },
  buildBackgrounds() {
    const TW = this.TW;
    this.bgFar = this.makeLayer((g, rnd) => {
      // morros distantes
      g.fillStyle = '#120b2a';
      g.beginPath(); g.moveTo(0, 360);
      for (let x = 0; x <= TW; x += 20) g.lineTo(x, 230 + Math.sin(x / TW * Math.PI * 4) * 18 + Math.sin(x / TW * Math.PI * 10) * 6);
      g.lineTo(TW, 360); g.closePath(); g.fill();
      // árvores metálicas distantes
      for (let i = 0; i < 14; i++) {
        const x = rnd() * TW, h = 120 + rnd() * 110, w = 4 + rnd() * 5;
        for (const ox of [-TW, 0, TW]) this.farTree(g, x + ox, h, w, rnd() * 1000);
      }
    }, 7);
    this.bgMid = this.makeLayer((g, rnd) => {
      for (let i = 0; i < 9; i++) {
        const x = rnd() * TW, h = 170 + rnd() * 120, w = 10 + rnd() * 10, s = rnd() * 1000;
        for (const ox of [-TW, 0, TW]) this.midTree(g, x + ox, h, w, s);
      }
      // cipós neon pendurados do topo
      for (let i = 0; i < 12; i++) {
        const x = rnd() * TW, len = 40 + rnd() * 120, s = rnd();
        for (const ox of [-TW, 0, TW]) this.vine(g, x + ox, len, s);
      }
      // cogumelos bioluminescentes
      for (let i = 0; i < 10; i++) {
        const x = rnd() * TW, y = 296 - rnd() * 6, sz = 3 + rnd() * 5, hue = rnd() < 0.5 ? '#b44dff' : '#3ff6ff';
        for (const ox of [-TW, 0, TW]) this.mushroom(g, x + ox, y, sz, hue);
      }
    }, 21);
    this.flies = [];
    const rnd = Util.mulberry(99);
    for (let i = 0; i < 36; i++) this.flies.push({ x: rnd() * TW, y: 40 + rnd() * 240, ph: rnd() * 6.28, f: 0.25 + rnd() * 0.45, c: rnd() < 0.6 ? '#9dff6a' : (rnd() < 0.5 ? '#3ff6ff' : '#d27bff'), s: 1 + rnd() * 1.6 });
    this.skyGrad = null; this.groundGrad = null;
  },
  farTree(g, x, h, w, s) {
    const base = 300, top = base - h;
    g.fillStyle = '#1d1340';
    g.fillRect(x - w / 2, top, w, h);
    g.strokeStyle = '#2a1b5c'; g.lineWidth = 2;
    const rnd = Util.mulberry(s | 0);
    for (let k = 0; k < 4; k++) {
      const y = top + 10 + rnd() * h * 0.6, dir = rnd() < 0.5 ? -1 : 1, l = 14 + rnd() * 26;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + dir * l, y - l * 0.6); g.lineTo(x + dir * l, y - l * 0.6 - 10); g.stroke();
      g.fillStyle = 'rgba(210,90,255,0.55)';
      g.beginPath(); g.arc(x + dir * l, y - l * 0.6 - 10, 1.6, 0, 6.28); g.fill();
    }
  },
  midTree(g, x, h, w, s) {
    const base = 300, top = base - h;
    const gr = g.createLinearGradient(x - w, 0, x + w, 0);
    gr.addColorStop(0, '#06161c'); gr.addColorStop(0.5, '#0d2c35'); gr.addColorStop(1, '#06161c');
    g.fillStyle = gr;
    g.beginPath(); g.moveTo(x - w * 0.6, base); g.lineTo(x - w * 0.35, top); g.lineTo(x + w * 0.35, top); g.lineTo(x + w * 0.6, base); g.closePath(); g.fill();
    // veias neon
    const rnd = Util.mulberry(s | 0);
    g.lineWidth = 1.2;
    for (let k = 0; k < 3; k++) {
      g.strokeStyle = k === 1 ? 'rgba(63,246,255,0.38)' : 'rgba(120,255,140,0.3)';
      g.beginPath();
      let yy = base, xx = x + (rnd() - 0.5) * w * 0.6;
      g.moveTo(xx, yy);
      while (yy > top + 10) { yy -= 12 + rnd() * 12; xx = x + (rnd() - 0.5) * w * 0.5; g.lineTo(xx, yy); }
      g.stroke();
    }
    // galhos/copa metálica
    g.strokeStyle = '#0d2c35'; g.lineWidth = 4;
    for (let k = 0; k < 5; k++) {
      const dir = k % 2 ? 1 : -1, l = 20 + rnd() * 40, yy = top + rnd() * 30;
      g.beginPath(); g.moveTo(x, yy + 10); g.lineTo(x + dir * l, yy - 8); g.stroke();
      g.fillStyle = 'rgba(63,246,255,0.8)';
      g.fillRect(x + dir * l - 1.5, yy - 9.5, 3, 3);
    }
    g.fillStyle = 'rgba(30,90,80,0.35)';
    g.beginPath(); g.ellipse(x, top + 5, w * 3, 18, 0, 0, 6.28); g.fill();
  },
  vine(g, x, len, s) {
    g.save();
    g.shadowColor = '#7dff6a'; g.shadowBlur = 6;
    g.strokeStyle = 'rgba(125,255,106,0.45)'; g.lineWidth = 1.1;
    g.beginPath(); g.moveTo(x, 0);
    for (let y = 0; y <= len; y += 6) g.lineTo(x + Math.sin(y / 14 + s * 6) * 4, y);
    g.stroke();
    g.fillStyle = s > 0.5 ? '#3ff6ff' : '#c07bff';
    g.beginPath(); g.arc(x + Math.sin(len / 14 + s * 6) * 4, len + 2, 2, 0, 6.28); g.fill();
    g.restore();
  },
  mushroom(g, x, y, sz, c) {
    g.save();
    g.fillStyle = '#0b1d22'; g.fillRect(x - 0.8, y - sz, 1.6, sz);
    g.shadowColor = c; g.shadowBlur = 8; g.fillStyle = c;
    g.beginPath(); g.ellipse(x, y - sz, sz * 0.9, sz * 0.45, 0, Math.PI, 0); g.fill();
    g.restore();
  },
  drawLayer(img, factor, camX) {
    const TW = this.TW;
    let off = -((camX * factor) % TW);
    if (off > 0) off -= TW;
    for (let x = off; x < View.viewW; x += TW) ctx.drawImage(img, x, 0, TW, CONFIG.world.height);
  },
  drawSky(t) {
    if (!this.skyGrad) {
      const g = ctx.createLinearGradient(0, 0, 0, 360);
      g.addColorStop(0, '#05030f'); g.addColorStop(0.45, '#130a2e'); g.addColorStop(0.8, '#0a2a33'); g.addColorStop(1, '#0b3b36');
      this.skyGrad = g;
    }
    ctx.fillStyle = this.skyGrad; ctx.fillRect(0, 0, View.viewW, 360);
    // lua/estrela de dados
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(120,80,255,0.07)';
    ctx.beginPath(); ctx.arc(View.viewW * 0.72, 70, 60, 0, 6.28); ctx.fill();
    ctx.fillStyle = 'rgba(180,140,255,0.12)';
    ctx.beginPath(); ctx.arc(View.viewW * 0.72, 70, 26, 0, 6.28); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  },
  drawFlies(camX, t) {
    const TW = this.TW;
    ctx.globalCompositeOperation = 'lighter';
    for (const f of this.flies) {
      let x = (f.x - camX * f.f) % TW; if (x < 0) x += TW;
      x += Math.sin(t * 0.7 + f.ph) * 10;
      if (x > View.viewW + 5) continue;
      const y = f.y + Math.sin(t * 1.3 + f.ph * 2) * 8;
      const a = 0.4 + 0.6 * Math.max(0, Math.sin(t * 2.2 + f.ph));
      ctx.globalAlpha = a * 0.25; ctx.fillStyle = f.c;
      ctx.beginPath(); ctx.arc(x, y, f.s * 3, 0, 6.28); ctx.fill();
      ctx.globalAlpha = a;
      ctx.beginPath(); ctx.arc(x, y, f.s, 0, 6.28); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
};

/* ============================ Input ============================ */
const Input = {
  keys: new Set(),
  latch: new Set(),          // toques/teclas rápidos que começam e terminam no mesmo quadro
  held: {}, pressed: {}, released: {},
  actions: ['left', 'right', 'up', 'down', 'fire', 'jump', 'bomb', 'dash'],
  stick: { id: null, bx: 0, by: 0, kx: 0, ky: 0, dir: null },
  btnPointers: new Map(),   // pointerId -> nome do botão (ou null)
  uiPointers: new Map(),    // pointerId -> nome do botão do topo
  keyMap: {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    KeyJ: 'fire', KeyZ: 'fire', KeyK: 'jump', KeyX: 'jump', Space: 'jump',
    KeyL: 'bomb', KeyC: 'bomb', ShiftLeft: 'dash', ShiftRight: 'dash'
  },
  clear() {
    this.keys.clear(); this.latch.clear(); this.btnPointers.clear(); this.uiPointers.clear();
    this.stick.id = null; this.stick.dir = null;
    for (const a of this.actions) { this.held[a] = false; this.pressed[a] = false; this.released[a] = false; }
  },
  stickDirs(dx, dy) {
    const len = Math.hypot(dx, dy);
    if (len < CONFIG.input.deadzone) return null;
    const sector = ((Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) % 8) + 8) % 8;
    // 0 dir, 1 baixo-dir, 2 baixo, 3 baixo-esq, 4 esq, 5 cima-esq, 6 cima, 7 cima-dir
    return [
      { right: 1 }, { right: 1, down: 1 }, { down: 1 }, { left: 1, down: 1 },
      { left: 1 }, { left: 1, up: 1 }, { up: 1 }, { right: 1, up: 1 }
    ][sector];
  },
  update() {
    const h = {};
    for (const k of this.keys) { const a = this.keyMap[k]; if (a) h[a] = true; }
    if (this.stick.id !== null && this.stick.dir) for (const a in this.stick.dir) h[a] = true;
    for (const b of this.btnPointers.values()) if (b) h[b] = true;
    for (const a of this.latch) h[a] = true;
    this.latch.clear();
    if (h.left && h.right) { h.left = false; h.right = false; }
    for (const a of this.actions) {
      const v = !!h[a];
      this.pressed[a] = v && !this.held[a];
      this.released[a] = !v && this.held[a];
      this.held[a] = v;
    }
  }
};

/* ============================ Physics ============================ */
const Physics = {
  solids: [], oneways: [],
  move(b, dt, noGrav, ignoreOW) {
    const hw = b.w / 2, W = CONFIG.world;
    b.hitWall = 0;
    b.x += b.vx * dt;
    for (const s of this.solids) {
      if (b.x + hw > s.x && b.x - hw < s.x + s.w && b.y > s.y && b.y - b.h < s.y + s.h) {
        if (b.x < s.x + s.w / 2) { b.x = s.x - hw; b.hitWall = 1; } else { b.x = s.x + s.w + hw; b.hitWall = -1; }
        b.vx = 0;
      }
    }
    if (!noGrav) { b.vy += W.gravity * dt; if (b.vy > W.maxFall) b.vy = W.maxFall; }
    const prevY = b.y;
    b.y += b.vy * dt;
    const wasGround = b.onGround;
    b.onGround = false; b.groundType = null;
    for (const s of this.solids) {
      if (b.x + hw > s.x && b.x - hw < s.x + s.w && b.y > s.y && b.y - b.h < s.y + s.h) {
        if (b.vy >= 0) { b.y = s.y; b.vy = 0; b.onGround = true; b.groundType = 'solid'; }
        else { b.y = s.y + s.h + b.h; b.vy = 0; }
      }
    }
    if (!ignoreOW && b.vy >= 0 && !b.onGround) {
      for (const p of this.oneways) {
        if (b.x + hw > p.x && b.x - hw < p.x + p.w && prevY <= p.y + 0.01 && b.y >= p.y) {
          b.y = p.y; b.vy = 0; b.onGround = true; b.groundType = 'oneway'; break;
        }
      }
    }
    b.justLanded = b.onGround && !wasGround;
  },
  groundAt(x, y) {
    for (const s of this.solids) if (x > s.x && x < s.x + s.w && Math.abs(s.y - y) < 3) return true;
    for (const p of this.oneways) if (x > p.x && x < p.x + p.w && Math.abs(p.y - y) < 3) return true;
    return false;
  },
  pointInSolid(x, y) {
    for (const s of this.solids) if (x > s.x && x < s.x + s.w && y > s.y && y < s.y + s.h) return true;
    return false;
  }
};

/* ============================ Pools + FX ============================ */
const Pools = {
  bullets: [], particles: [], pCursor: 0, bCursor: 0,
  init() {
    for (let i = 0; i < CONFIG.fx.maxBullets; i++) this.bullets.push({ on: false });
    for (let i = 0; i < CONFIG.fx.maxParticles; i++) this.particles.push({ on: false });
  },
  bullet(props) {
    const arr = this.bullets, n = arr.length;
    for (let k = 0; k < n; k++) {
      const i = (this.bCursor + k) % n;
      if (!arr[i].on) { this.bCursor = i + 1; const b = arr[i]; Object.assign(b, props); b.on = true; return b; }
    }
    return null;
  },
  particle(props) {
    const arr = this.particles, n = arr.length;
    for (let k = 0; k < n; k++) {
      const i = (this.pCursor + k) % n;
      if (!arr[i].on) { this.pCursor = i + 1; const p = arr[i]; p.grav = 0; p.drag = 0; p.add = true; p.size = 2; p.kind = 'dot'; p.rot = 0; Object.assign(p, props); p.max = p.life; p.on = true; return p; }
    }
    return null;
  },
  clearBullets(owner) { for (const b of this.bullets) if (b.on && (!owner || b.owner === owner)) b.on = false; }
};

const FX = {
  sparks(x, y, n, color, speed = 160, dirX = 0, dirY = 0) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.283, s = speed * (0.3 + Math.random());
      Pools.particle({ x, y, vx: Math.cos(a) * s + dirX, vy: Math.sin(a) * s + dirY, life: 0.18 + Math.random() * 0.22, color, size: 1.5, kind: 'spark', grav: 300, drag: 3 });
    }
  },
  explosion(x, y, size = 1) {
    Pools.particle({ x, y, vx: 0, vy: 0, life: 0.25, color: '#ffffff', size: 18 * size, kind: 'flash' });
    Pools.particle({ x, y, vx: 0, vy: 0, life: 0.4, color: '#ff9a3c', size: 6 * size, kind: 'ring', grow: 90 * size });
    for (let i = 0; i < 14 * size; i++) {
      const a = Math.random() * 6.283, s = 60 + Math.random() * 180 * size;
      Pools.particle({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: 0.3 + Math.random() * 0.4, color: Math.random() < 0.5 ? '#ffcf4a' : '#ff5a2a', size: 2 + Math.random() * 3, kind: 'dot', drag: 3, grav: 200 });
    }
    for (let i = 0; i < 6 * size; i++) {
      Pools.particle({ x: x + Util.rand(-8, 8), y: y + Util.rand(-8, 8), vx: Util.rand(-30, 30), vy: Util.rand(-60, -20), life: 0.6 + Math.random() * 0.5, color: 'rgba(60,40,70,1)', size: 6 + Math.random() * 6, kind: 'smoke', add: false, drag: 1.5 });
    }
    this.sparks(x, y, 10 * size, '#ffe27a', 260);
  },
  dust(x, y, n = 5) {
    for (let i = 0; i < n; i++) Pools.particle({ x: x + Util.rand(-6, 6), y, vx: Util.rand(-50, 50), vy: Util.rand(-40, -10), life: 0.35, color: 'rgba(120,200,190,1)', size: 2 + Math.random() * 2, kind: 'smoke', add: false, drag: 4 });
  },
  update(dt) {
    for (const p of Pools.particles) {
      if (!p.on) continue;
      p.life -= dt;
      if (p.life <= 0) { p.on = false; continue; }
      if (p.drag) { const k = Math.max(0, 1 - p.drag * dt); p.vx *= k; p.vy *= k; }
      p.vy += p.grav * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.grow) p.size += p.grow * dt;
    }
  },
  draw() {
    // fumaça (normal) primeiro, depois brilhos (aditivo)
    for (const p of Pools.particles) {
      if (!p.on || p.add) continue;
      const k = p.life / p.max;
      ctx.globalAlpha = k * 0.5; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.6 - k * 0.6), 0, 6.28); ctx.fill();
    }
    ctx.globalCompositeOperation = 'lighter';
    for (const p of Pools.particles) {
      if (!p.on || !p.add) continue;
      const k = p.life / p.max;
      ctx.globalAlpha = k;
      if (p.kind === 'spark') {
        ctx.strokeStyle = p.color; ctx.lineWidth = p.size;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); ctx.stroke();
      } else if (p.kind === 'ring') {
        ctx.strokeStyle = p.color; ctx.lineWidth = 3 * k;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.28); ctx.stroke();
      } else if (p.kind === 'flash') {
        ctx.globalAlpha = k * 0.6; ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.6 + (1 - k)), 0, 6.28); ctx.fill();
      } else if (p.kind === 'ghost') {
        ctx.globalAlpha = k * 0.5; ctx.fillStyle = p.color;
        Util.rr(ctx, p.x - 7, p.y - p.size, 14, p.size, 4); ctx.fill();
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + k * 0.5), 0, 6.28); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
};

/* ============================ Player (KAI-4) ============================ */
const Player = {
  reset(x, y) {
    const C = CONFIG.player;
    Object.assign(this, {
      x, y, vx: 0, vy: 0, w: C.w, h: C.h, facing: 1, onGround: false, groundType: null,
      maxHp: Game.diff.hp, hp: Game.diff.hp, invuln: 0, dashT: 0, dashInv: 0, dashCd: 0, dashDir: 1, dashAir: false,
      coyote: 0, jumpBuf: 0, jumpCutDone: true, crouch: false, aimA: 0, fireCd: 0, muzzle: 0,
      runPhase: 0, drop: 0, ghostT: 0, dead: false, weapon: 'pulse', ammo: Infinity,
      bombs: CONFIG.bombs.start, bombCd: 0, knifeCd: 0, knifeT: 0, mech: null
    });
  },
  hurt(dmg, srcX) {
    if (this.dead || this.invuln > 0 || this.dashInv > 0) return false;
    this.hp -= dmg;
    this.invuln = CONFIG.player.invuln;
    Game.breakCombo();
    this.vx = (this.x < srcX ? -1 : 1) * CONFIG.player.knockback;
    if (this.onGround) this.vy = -180;
    Game.addShake(5, 0.2);
    FX.sparks(this.x, this.y - 18, 10, '#ff4d6d', 180);
    Audio.play('hurt');
    if (this.hp <= 0) { this.hp = 0; Game.playerDied(); }
    return true;
  },
  update(dt) {
    const C = CONFIG.player, I = Input.held, P = Input.pressed;
    if (this.dead) return;
    this.invuln = Math.max(0, this.invuln - dt);
    this.dashInv = Math.max(0, this.dashInv - dt);
    this.dashCd = Math.max(0, this.dashCd - dt);
    this.fireCd = Math.max(0, this.fireCd - dt);
    this.muzzle = Math.max(0, this.muzzle - dt);
    this.jumpBuf = Math.max(0, this.jumpBuf - dt);
    this.coyote = Math.max(0, this.coyote - dt);
    this.drop = Math.max(0, this.drop - dt);
    this.bombCd = Math.max(0, this.bombCd - dt);
    this.knifeCd = Math.max(0, this.knifeCd - dt);
    this.knifeT = Math.max(0, this.knifeT - dt);

    // ---- Cyber-Dash
    if (P.dash && this.dashCd <= 0 && this.dashT <= 0) {
      this.dashDir = I.left ? -1 : (I.right ? 1 : this.facing);
      this.facing = this.dashDir;
      this.dashT = C.dashTime; this.dashInv = C.dashInvuln; this.dashCd = C.dashCooldown;
      this.dashAir = !this.onGround;
      this.vy = this.dashAir ? 0 : this.vy;
      Audio.play('dash');
      Pools.particle({ x: this.x, y: this.y - 16, vx: 0, vy: 0, life: 0.25, color: '#3ff6ff', size: 6, kind: 'ring', grow: 120 });
    }

    // ---- Agachar
    const wantCrouch = I.down && this.onGround && this.dashT <= 0;
    this.crouch = wantCrouch;
    this.h = wantCrouch ? C.crouchH : C.h;

    // ---- Movimento horizontal
    if (this.dashT > 0) {
      this.dashT -= dt;
      this.vx = this.dashDir * C.dashSpeed;
      if (this.dashAir) this.vy = 0;
      this.ghostT -= dt;
      if (this.ghostT <= 0) {
        this.ghostT = 0.025;
        Pools.particle({ x: this.x, y: this.y, vx: 0, vy: 0, life: 0.22, color: '#3ff6ff', size: this.h + 6, kind: 'ghost' });
      }
      if (this.dashT <= 0) this.vx = this.dashDir * C.speed;
    } else {
      const dir = (I.right ? 1 : 0) - (I.left ? 1 : 0);
      const target = dir * C.speed * (wantCrouch ? C.crouchSpeedMul : 1);
      const acc = this.onGround ? (dir ? C.accel : C.friction) : C.airAccel;
      this.vx = Util.approach(this.vx, target, acc * dt);
      if (dir) this.facing = dir;
    }

    // ---- Pulo (coyote + buffer + altura variável)
    if (this.onGround) this.coyote = C.coyote;
    if (P.jump) this.jumpBuf = C.jumpBuffer;
    if (this.jumpBuf > 0 && this.coyote > 0 && this.dashT <= 0) {
      if (I.down && this.onGround && this.groundType === 'oneway') {
        this.drop = C.dropThrough; this.y += 2; this.onGround = false;
      } else {
        this.vy = -C.jumpVel; this.jumpCutDone = false; this.onGround = false;
        Audio.play('jump'); FX.dust(this.x, this.y, 4);
      }
      this.jumpBuf = 0; this.coyote = 0;
    }
    if (!I.jump && !this.jumpCutDone && this.vy < 0) { this.vy *= C.jumpCut; this.jumpCutDone = true; }
    if (this.vy >= 0) this.jumpCutDone = true;

    const vyBefore = this.vy;
    Physics.move(this, dt, this.dashT > 0 && this.dashAir, this.drop > 0);
    if (this.justLanded && vyBefore > 250) { FX.dust(this.x, this.y, 5); Audio.play('land'); }

    // limites da câmera
    const minX = Game.camX + this.w / 2 + 2, maxX = Level.length - 10;
    if (this.x < minX) { this.x = minX; if (this.vx < 0) this.vx = 0; }
    if (this.x > maxX) this.x = maxX;

    // queda no vazio
    if (this.y > CONFIG.world.height + 60) { this.hp = 0; Game.playerDied(); return; }

    // animação de corrida
    if (this.onGround && Math.abs(this.vx) > 10) this.runPhase += dt * Math.abs(this.vx) * 0.085;

    // ---- Mira
    let a = 0;
    if (this.dashT <= 0) {
      if (I.up) a = (I.left || I.right) ? -Math.PI / 4 : -Math.PI / 2;
      else if (I.down && !this.onGround) a = Math.PI / 2;
    }
    this.aimA = a;

    // ---- Faca de Plasma / Tiro (segurar = automático)
    if (I.fire && this.dashT <= 0) {
      if (this.knifeCd <= 0 && this.knifeTargets(false)) this.knife();
      else if (this.fireCd <= 0 && this.knifeT <= 0) this.shoot();
    }
    // ---- Bomba
    if (P.bomb && this.dashT <= 0) this.throwBomb();
  },
  setWeapon(w) {
    this.weapon = w;
    this.ammo = CONFIG.weapons[w].ammo;
  },
  // alvos ao alcance da faca (inimigos, cápsulas, caixas)
  knifeTargets(apply) {
    const C = CONFIG.knife, f = this.facing, top = this.y - this.h, bot = this.y;
    let found = false;
    const test = o => {
      const rel = (o.x - this.x) * f;
      return rel > -4 && rel - o.w / 2 - this.w / 2 < C.range && o.y > top && o.y - o.h < bot;
    };
    for (const e of Enemies.list) if (!e.dead && test(e)) { found = true; if (apply) Enemies.damage(e, C.dmg, true); else return true; }
    for (const pr of Props.list) if (pr.alive && test(pr)) { found = true; if (apply) Props.damage(pr, C.dmg); else return true; }
    if (Boss.active && !Boss.dying && test(Boss)) { found = true; if (apply) Boss.damage(C.dmg); else return true; }
    return found;
  },
  knife() {
    this.knifeCd = CONFIG.knife.rate; this.knifeT = CONFIG.knife.anim; this.fireCd = 0.12;
    this.knifeTargets(true);
    Game.hitStop = Math.max(Game.hitStop, CONFIG.fx.hitStop);
    Game.addShake(2.5, 0.1);
    const hx = this.x + this.facing * 22, hy = this.y - this.h * 0.6;
    FX.sparks(hx, hy, 10, '#9dfcff', 200, this.facing * 120, 0);
    Pools.particle({ x: hx, y: hy, vx: 0, vy: 0, life: 0.1, color: '#e8ffff', size: 12, kind: 'flash' });
    Audio.play('knife');
  },
  throwBomb() {
    const B = CONFIG.bombs;
    if (this.bombCd > 0) return;
    if (this.bombs <= 0) { Audio.play('empty'); return; }
    this.bombs--; this.bombCd = B.rate;
    const up = this.aimA < 0;
    Bombs.spawn(this.x + this.facing * 8, this.y - this.h + 4, this.facing * B.throwVx * (up ? 0.6 : 1) + this.vx * 0.3, up ? B.throwVyUp : B.throwVy);
    Audio.play('throw');
  },
  shoulder() {
    const off = this.crouch ? 9 : 0;
    return { x: this.x + this.facing * 1, y: this.y - 26 + off };
  },
  shoot() {
    const wn = this.weapon, W = CONFIG.weapons[wn];
    this.fireCd = W.rate;
    const s = this.shoulder();
    const f = this.facing;
    const dirOf = a => [Math.cos(a) * f, Math.sin(a)];
    let [dx, dy] = dirOf(this.aimA);
    const mx = s.x + dx * 18, my = s.y + dy * 18;
    if (wn === 'pulse') {
      [dx, dy] = dirOf(this.aimA + Util.rand(-W.jitter, W.jitter));
      Pools.bullet({ x: mx, y: my, vx: dx * W.speed, vy: dy * W.speed, life: W.life, owner: 'p', kind: 'pulse', dmg: W.dmg, r: 3, pierce: false });
      Pools.particle({ x: mx, y: my, vx: 0, vy: 0, life: 0.06, color: '#bffcff', size: 7, kind: 'flash' });
      if (Math.random() < 0.5) FX.sparks(mx, my, 2, '#3ff6ff', 90, dx * 80, dy * 80);
      Audio.play('shoot');
    } else if (wn === 'spread') {
      for (let i = 0; i < W.count; i++) {
        const a = this.aimA + (i / (W.count - 1) - 0.5) * W.arc;
        const [ex, ey] = dirOf(a);
        Pools.bullet({ x: mx, y: my, vx: ex * W.speed, vy: ey * W.speed, life: W.life, owner: 'p', kind: 'spread', dmg: W.dmg, r: 4, pierce: false });
      }
      Pools.particle({ x: mx, y: my, vx: 0, vy: 0, life: 0.08, color: '#ffd27a', size: 10, kind: 'flash' });
      Audio.play('spread');
    } else if (wn === 'laser') {
      Pools.bullet({ x: mx + dx * W.len, y: my + dy * W.len, vx: dx * W.speed, vy: dy * W.speed, life: W.life, owner: 'p', kind: 'laser', dmg: W.dmg, r: 4, pierce: true, hits: [], len: W.len });
      Pools.particle({ x: mx, y: my, vx: 0, vy: 0, life: 0.08, color: '#ff9af0', size: 9, kind: 'flash' });
      Audio.play('laser');
    } else if (wn === 'flame') {
      [dx, dy] = dirOf(this.aimA + Util.rand(-W.spreadA, W.spreadA));
      const sp = W.speed * Util.rand(0.85, 1.1);
      Pools.bullet({ x: mx, y: my, vx: dx * sp + this.vx * 0.5, vy: dy * sp, life: W.life, max: W.life, owner: 'p', kind: 'flame', dmg: W.dmg, r: 4, pierce: true, noWall: false });
      Audio.play('flame');
    }
    this.muzzle = 0.05;
    if (W.ammo !== Infinity) {
      this.ammo--;
      if (this.ammo <= 0) { this.setWeapon('pulse'); Game.popup(this.x, this.y - 48, 'MUNIÇÃO ESGOTADA', '#ff9a9a'); Audio.play('empty'); }
    }
  },
  draw(t) {
    if (this.dead) return;
    if (this.invuln > 0 && Math.floor(t * 18) % 2 === 0) ctx.globalAlpha = 0.3;
    const off = this.crouch ? 8 : 0;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.facing, 1);
    // pernas
    let la, ra, lk, rk;
    if (!this.onGround) { la = -0.6; ra = 0.35; lk = 1.1; rk = 0.5; }
    else if (this.crouch) { la = 1.15; ra = 0.8; lk = 2.2; rk = 1.9; }
    else if (Math.abs(this.vx) > 10) {
      const s = Math.sin(this.runPhase), c = Math.cos(this.runPhase);
      la = s * 0.7; ra = -s * 0.7; lk = 0.25 + Math.max(0, c) * 1.0; rk = 0.25 + Math.max(0, -c) * 1.0;
    } else { la = 0.08; ra = -0.08; lk = 0.12; rk = 0.12; }
    const hipY = -16 + off;
    const leg = (a, k, col) => {
      const L = 8.5;
      const kx = Math.sin(a) * L, ky = hipY + Math.cos(a) * L;
      const fx = kx + Math.sin(a - k) * L, fy = ky + Math.cos(a - k) * L;
      ctx.strokeStyle = col; ctx.lineWidth = 4.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(0, hipY); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
      ctx.fillStyle = '#2a3542'; ctx.fillRect(fx - 2, fy - 2, 7, 3.5);
    };
    leg(ra, rk, '#6f8295');
    // mochila propulsora
    ctx.fillStyle = '#3a4757'; Util.rr(ctx, -13, -30 + off, 7, 14, 2); ctx.fill();
    ctx.fillStyle = '#55ff9a'; ctx.fillRect(-11.5, -27 + off, 2, 6);
    if ((!this.onGround && this.vy < 60) || this.dashT > 0) {
      const fl = 6 + Math.random() * 7 + (this.vy < -200 ? 5 : 0);
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,150,50,0.85)';
      ctx.beginPath(); ctx.moveTo(-12.5, -16 + off); ctx.lineTo(-9.5, -16 + off + fl); ctx.lineTo(-6.5, -16 + off); ctx.fill();
      ctx.fillStyle = 'rgba(120,240,255,0.9)';
      ctx.beginPath(); ctx.moveTo(-11.5, -16 + off); ctx.lineTo(-9.5, -16 + off + fl * 0.55); ctx.lineTo(-7.5, -16 + off); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    // tronco
    ctx.fillStyle = '#dfe8ee'; Util.rr(ctx, -7, -31 + off, 14, 16, 3); ctx.fill();
    ctx.fillStyle = '#9fb2c2'; ctx.fillRect(-7, -19 + off, 14, 4);
    // núcleo verde
    const pulse = 0.6 + 0.4 * Math.sin(t * 6);
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = `rgba(85,255,154,${0.25 * pulse})`; ctx.beginPath(); ctx.arc(2, -24 + off, 5, 0, 6.28); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#55ff9a'; ctx.beginPath(); ctx.arc(2, -24 + off, 2.3, 0, 6.28); ctx.fill();
    // cabeça
    ctx.fillStyle = '#eef4f8'; Util.rr(ctx, -6, -42 + off, 13, 11, 4); ctx.fill();
    ctx.fillStyle = '#1b2430'; Util.rr(ctx, 0, -39.5 + off, 7.5, 4.5, 2); ctx.fill();
    ctx.fillStyle = '#3ff6ff'; ctx.fillRect(1.5, -38.5 + off, 5.5, 2.4);
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(63,246,255,0.3)'; ctx.fillRect(0, -40 + off, 9, 5.5);
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = '#9fb2c2'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-3, -42 + off); ctx.lineTo(-5, -47 + off); ctx.stroke();
    ctx.fillStyle = '#55ff9a'; ctx.beginPath(); ctx.arc(-5, -47 + off, 1.3, 0, 6.28); ctx.fill();
    // perna da frente
    leg(la, lk, '#c9d6e0');
    // braço + arma (gira para a mira)
    ctx.save();
    ctx.translate(1, -26 + off);
    ctx.rotate(this.aimA);
    ctx.fillStyle = '#b8c7d4'; Util.rr(ctx, -2, -2.5, 9, 5, 2); ctx.fill();
    ctx.fillStyle = '#2a3542'; Util.rr(ctx, 5, -3.2, 12, 6.4, 1.5); ctx.fill();
    const gunCol = this.weapon === 'pulse' ? '#3ff6ff' : CONFIG.weapons[this.weapon].color;
    ctx.fillStyle = gunCol; ctx.fillRect(7, -1, 7, 1.6);
    ctx.fillStyle = '#4b5b6c'; ctx.fillRect(15, -2, 3, 4);
    if (this.weapon !== 'pulse') { ctx.fillStyle = gunCol; ctx.fillRect(9, 3.2, 6, 2.5); }
    if (this.muzzle > 0) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(160,255,255,0.9)';
      ctx.beginPath(); ctx.moveTo(18, -4); ctx.lineTo(28 + Math.random() * 4, 0); ctx.lineTo(18, 4); ctx.fill();
      ctx.fillStyle = 'rgba(63,246,255,0.35)';
      ctx.beginPath(); ctx.arc(20, 0, 8, 0, 6.28); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
    // corte elétrico da faca
    if (this.knifeT > 0) {
      const k = 1 - this.knifeT / CONFIG.knife.anim;
      const cy = -this.h * 0.6;
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = `rgba(120,250,255,${1 - k})`; ctx.lineWidth = 6 * (1 - k) + 1;
      ctx.beginPath(); ctx.arc(6, cy, 22, -1.3 + k * 0.6, 1.0 + k * 0.6); ctx.stroke();
      ctx.strokeStyle = `rgba(255,255,255,${1 - k})`; ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let i = 0; i <= 6; i++) { const a = -1.2 + i * 0.36 + k * 0.6, rr = 22 + Util.rand(-3, 3); const px = 6 + Math.cos(a) * rr, py = cy + Math.sin(a) * rr; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }
};

/* ============================ Enemies ============================ */
const Enemies = {
  list: [],
  create(type, x, y) {
    const c = CONFIG.enemies[type];
    const e = { type, x, y, vx: 0, vy: 0, w: c.w, h: c.h, hp: c.hp, flameCd: 0, aimA: Math.PI, burstLeft: 0, shotT: 0, facing: -1, flash: 0, state: 'idle', t: 0, fireT: c.fireRate ? c.fireRate * 0.7 : 0, onGround: false, dead: false, anim: Math.random() * 6, patrolDir: -1, patrolT: 1 + Math.random() * 2, tele: 0 };
    this.list.push(e);
    return e;
  },
  damage(e, dmg, strong) {
    if (e.dead) return;
    e.hp -= dmg; e.flash = 0.07;
    if (!strong) Audio.play('hit');
    if (e.hp <= 0) this.kill(e);
  },
  kill(e) {
    e.dead = true;
    const c = CONFIG.enemies[e.type];
    FX.explosion(e.x, e.y - e.h / 2, 1);
    Game.addShake(4, 0.15);
    Game.hitStop = Math.max(Game.hitStop, CONFIG.fx.hitStop);
    Game.registerKill(e.x, e.y - e.h - 6, c.score);
    Audio.play('explode');
  },
  update(dt) {
    const p = Player, D = Game.diff;
    for (const e of this.list) {
      if (e.dead) continue;
      e.flash = Math.max(0, e.flash - dt);
      e.flameCd = Math.max(0, e.flameCd - dt);
      e.anim += dt;
      const onScreen = e.x < Game.camX + View.viewW + 10 && e.x > Game.camX - 10;
      const dx = p.x - e.x, dist = Math.abs(dx);
      if (e.type === 'soldier') {
        const c = CONFIG.enemies.soldier;
        if (onScreen && !p.dead && dist < c.range) {
          e.facing = dx < 0 ? -1 : 1;
          // mantém distância
          if (dist < c.keepDist && e.onGround && Physics.groundAt(e.x - e.facing * 12, e.y)) e.vx = -e.facing * c.speed * D.speedMul;
          else e.vx = Util.approach(e.vx, 0, 400 * dt);
          e.fireT -= dt * D.fireMul;
          if (e.fireT < c.telegraph && e.tele === 0) { e.tele = 1; }
          if (e.fireT <= 0) {
            e.tele = 0;
            e.fireT = c.fireRate * Util.rand(0.8, 1.25);
            const gx = e.x + e.facing * 14, gy = e.y - 21;
            let ang = Math.atan2((p.y - 16) - gy, Math.abs((p.x) - gx));
            const lim = c.maxAimDeg * Math.PI / 180;
            ang = Util.clamp(ang, -lim, lim);
            const sp = c.bulletSpeed * D.speedMul;
            Pools.bullet({ x: gx, y: gy, vx: Math.cos(ang) * sp * e.facing, vy: Math.sin(ang) * sp, life: c.bulletLife, owner: 'e', dmg: CONFIG.enemyBulletDmg, r: 4 });
            Pools.particle({ x: gx, y: gy, vx: 0, vy: 0, life: 0.08, color: '#ff4dd2', size: 7, kind: 'flash' });
            Audio.play('eshot');
          }
        } else {
          e.tele = 0;
          // patrulha curta
          e.patrolT -= dt;
          if (e.patrolT <= 0) { e.patrolDir *= -1; e.patrolT = 1.2 + Math.random() * 1.5; }
          if (e.onGround && !Physics.groundAt(e.x + e.patrolDir * 12, e.y)) e.patrolDir *= -1;
          e.vx = e.patrolDir * c.speed * 0.6 * D.speedMul; e.facing = e.patrolDir;
        }
        Physics.move(e, dt);
      } else if (e.type === 'runner') {
        const c = CONFIG.enemies.runner;
        e.t -= dt;
        if (e.state === 'idle') {
          e.vx = Util.approach(e.vx, 0, 600 * dt);
          if (onScreen && !p.dead && dist < c.triggerDist) { e.state = 'windup'; e.t = c.windup; e.facing = dx < 0 ? -1 : 1; }
        } else if (e.state === 'windup') {
          e.vx = 0;
          if (e.t <= 0) { e.state = 'charge'; e.t = c.chargeTime; e.facing = dx < 0 ? -1 : 1; }
        } else if (e.state === 'charge') {
          e.vx = e.facing * c.speed * D.speedMul;
          if (e.hitWall && e.onGround) e.vy = -380;
          if (e.t <= 0 || (dx * e.facing < -70)) { e.state = 'recover'; e.t = c.recover; }
          if (Math.random() < 0.3) Pools.particle({ x: e.x - e.facing * 8, y: e.y - 2, vx: -e.facing * 40, vy: -20, life: 0.25, color: 'rgba(120,100,90,1)', size: 2.5, kind: 'smoke', add: false, drag: 3 });
        } else if (e.state === 'recover') {
          e.vx = Util.approach(e.vx, 0, 700 * dt);
          if (e.t <= 0) e.state = 'idle';
        }
        Physics.move(e, dt);
      } else if (e.type === 'turret') {
        const c = CONFIG.enemies.turret;
        e.vx = 0;
        const gx = e.x, gy = e.y - 14;
        let ta = Math.atan2((p.y - 16) - gy, p.x - gx);
        if (ta > 0.35 && ta < Math.PI - 0.35) ta = ta < Math.PI / 2 ? 0.35 : Math.PI - 0.35;
        let d = ta - e.aimA; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
        e.aimA += Util.clamp(d, -c.turnSpeed * dt, c.turnSpeed * dt);
        if (onScreen && !p.dead && dist < c.range) {
          if (e.burstLeft > 0) {
            e.shotT -= dt;
            if (e.shotT <= 0) {
              e.burstLeft--; e.shotT = c.burstGap;
              const mx = gx + Math.cos(e.aimA) * 17, my = gy + Math.sin(e.aimA) * 17, sp = c.bulletSpeed * D.speedMul;
              Pools.bullet({ x: mx, y: my, vx: Math.cos(e.aimA) * sp, vy: Math.sin(e.aimA) * sp, life: c.bulletLife, owner: 'e', dmg: CONFIG.enemyBulletDmg, r: 4 });
              Pools.particle({ x: mx, y: my, vx: 0, vy: 0, life: 0.08, color: '#ff4dd2', size: 7, kind: 'flash' });
              Audio.play('eshot');
            }
          } else {
            e.fireT -= dt * D.fireMul;
            e.tele = e.fireT < c.telegraph ? 1 : 0;
            if (e.fireT <= 0) { e.burstLeft = c.burst; e.shotT = 0; e.fireT = c.fireRate * Util.rand(0.9, 1.2); e.tele = 0; }
          }
        } else e.tele = 0;
        Physics.move(e, dt);
      }
      // contato
      const cc = CONFIG.enemies[e.type];
      if (cc.contactDmg > 0 && !p.dead && Util.overlap(e, p)) {
        const c = cc;
        if (p.hurt(c.contactDmg, e.x) && e.type === 'runner') {
          e.state = 'recover'; e.t = c.recover; e.vx = -e.facing * 160; e.vy = -200;
        }
      }
      if (e.y > CONFIG.world.height + 80) e.dead = true;
    }
    // remove inimigos mortos ou deixados para trás
    this.list = this.list.filter(e => !e.dead && e.x > Game.camX - 120);
  },
  draw(t) {
    for (const e of this.list) {
      ctx.save();
      ctx.translate(e.x, e.y);
      if (e.type === 'turret') this.drawTurret(e, t);
      else { ctx.scale(e.facing, 1); if (e.type === 'soldier') this.drawSoldier(e, t); else this.drawRunner(e, t); }
      ctx.restore();
    }
  },
  drawTurret(e, t) {
    const fl = e.flash > 0;
    ctx.fillStyle = fl ? '#fff' : '#2b2e3d';
    ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(-9, -9); ctx.lineTo(9, -9); ctx.lineTo(12, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#d23cff'; ctx.fillRect(-9, -9, 18, 1.5);
    // cano
    ctx.save(); ctx.translate(0, -14); ctx.rotate(e.aimA);
    ctx.fillStyle = fl ? '#fff' : '#22242f'; ctx.fillRect(0, -3, 17, 6);
    ctx.fillStyle = '#ff4dd2'; ctx.fillRect(14, -2, 3, 4);
    if (e.tele) {
      const k = 1 - Math.max(0, e.fireT) / CONFIG.enemies.turret.telegraph;
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `rgba(255,77,210,${0.3 + 0.5 * k})`; ctx.beginPath(); ctx.arc(18, 0, 2 + k * 6, 0, 6.28); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
    // cúpula
    ctx.fillStyle = fl ? '#fff' : '#4a4f63'; ctx.beginPath(); ctx.arc(0, -14, 8.5, 0, 6.28); ctx.fill();
    ctx.strokeStyle = '#2b2e3d'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#ff2a6d'; ctx.beginPath(); ctx.arc(Math.cos(e.aimA) * 4, -14 + Math.sin(e.aimA) * 4, 2, 0, 6.28); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = `rgba(255,42,109,${e.tele ? 0.5 : 0.2})`; ctx.beginPath(); ctx.arc(Math.cos(e.aimA) * 4, -14 + Math.sin(e.aimA) * 4, 5, 0, 6.28); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  },
  drawSoldier(e, t) {
    const flash = e.flash > 0;
    const walk = Math.abs(e.vx) > 5 ? Math.sin(e.anim * 10) : 0;
    const body = flash ? '#ffffff' : '#4a4f63', dark = flash ? '#ffffff' : '#2b2e3d';
    // pernas
    ctx.strokeStyle = dark; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-4, -14); ctx.lineTo(-4 + walk * 4, -1); ctx.moveTo(4, -14); ctx.lineTo(4 - walk * 4, -1); ctx.stroke();
    ctx.fillStyle = dark; ctx.fillRect(-8 + walk * 4, -3, 8, 3); ctx.fillRect(1 - walk * 4, -3, 8, 3);
    // corpo
    ctx.fillStyle = body; Util.rr(ctx, -9, -31, 18, 18, 3); ctx.fill();
    if (!flash) {
      ctx.strokeStyle = '#d23cff'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-6, -29); ctx.lineTo(-2, -24); ctx.lineTo(-5, -19); ctx.moveTo(3, -27); ctx.lineTo(6, -22); ctx.stroke();
    }
    // cabeça
    ctx.fillStyle = flash ? '#fff' : '#5c6278'; Util.rr(ctx, -6, -40, 13, 10, 3); ctx.fill();
    const eyeA = e.tele ? (0.6 + 0.4 * Math.sin(t * 40)) : 0.8;
    ctx.fillStyle = '#ff2a6d'; ctx.fillRect(0, -37, 7, 2.5);
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = `rgba(255,42,109,${0.25 * eyeA})`; ctx.beginPath(); ctx.arc(4, -36, e.tele ? 7 : 4, 0, 6.28); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    // arma
    ctx.fillStyle = flash ? '#fff' : '#22242f'; ctx.fillRect(2, -24, 15, 5);
    ctx.fillStyle = '#ff4dd2'; ctx.fillRect(14, -23, 3, 3);
    if (e.tele) {
      ctx.globalCompositeOperation = 'lighter';
      const k = 1 - Math.max(0, e.fireT) / CONFIG.enemies.soldier.telegraph;
      ctx.fillStyle = `rgba(255,77,210,${0.3 + 0.5 * k})`;
      ctx.beginPath(); ctx.arc(17, -21.5, 2 + k * 5, 0, 6.28); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
  },
  drawRunner(e, t) {
    const flash = e.flash > 0;
    const shake = e.state === 'windup' ? Util.rand(-1, 1) : 0;
    const charging = e.state === 'charge';
    const ph = e.anim * (charging ? 22 : 6);
    const s = Math.abs(e.vx) > 5 ? Math.sin(ph) : 0;
    ctx.translate(shake, 0);
    const body = flash ? '#ffffff' : '#6b2a3a', dark = flash ? '#ffffff' : '#3a1420';
    // pernas digitígradas
    ctx.strokeStyle = dark; ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-3, -12); ctx.lineTo(-7 + s * 5, -6); ctx.lineTo(-4 + s * 7, 0);
    ctx.moveTo(3, -12); ctx.lineTo(-1 - s * 5, -6); ctx.lineTo(3 - s * 7, 0);
    ctx.stroke();
    // corpo inclinado
    ctx.save(); ctx.rotate(charging ? 0.35 : 0.15);
    ctx.fillStyle = body; Util.rr(ctx, -9, -24, 18, 13, 4); ctx.fill();
    ctx.fillStyle = flash ? '#fff' : '#ff7a1a';
    ctx.beginPath(); ctx.moveTo(-8, -24); ctx.lineTo(-5, -30); ctx.lineTo(-2, -24); ctx.moveTo(-2, -24); ctx.lineTo(1, -29); ctx.lineTo(4, -24); ctx.fill();
    // cabeça
    ctx.fillStyle = flash ? '#fff' : '#843347'; Util.rr(ctx, 5, -26, 10, 9, 3); ctx.fill();
    ctx.fillStyle = '#ffb31a'; ctx.fillRect(10, -23.5, 4, 2);
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = e.state === 'windup' ? 'rgba(255,180,40,0.6)' : 'rgba(255,140,30,0.25)';
    ctx.beginPath(); ctx.arc(12, -22.5, e.state === 'windup' ? 7 : 4, 0, 6.28); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    // garras
    ctx.strokeStyle = flash ? '#fff' : '#ffd0a0'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(6, -15); ctx.lineTo(16, -11); ctx.moveTo(6, -13); ctx.lineTo(15, -8); ctx.stroke();
    ctx.restore();
  }
};

/* ============================ Bullets ============================ */
const Bullets = {
  // testa se a bala atinge o corpo o
  hitBody(b, o) {
    return b.x > o.x - o.w / 2 - b.r && b.x < o.x + o.w / 2 + b.r && b.y > o.y - o.h - b.r && b.y < o.y + b.r;
  },
  // aplica dano de bala do jogador em um alvo; retorna true se a bala deve sumir
  applyHit(b, o, dmgFn) {
    if (b.kind === 'flame') {
      if (o.flameCd > 0) return false;
      o.flameCd = CONFIG.weapons.flame.hitCd;
      dmgFn(o, b.dmg);
      return false;
    }
    if (b.pierce) {
      if (b.hits.includes(o)) return false;
      b.hits.push(o);
      dmgFn(o, b.dmg);
      FX.sparks(b.x, b.y, 4, '#ffb0f0', 140);
      return false;
    }
    dmgFn(o, b.dmg);
    FX.sparks(b.x, b.y, 5, b.kind === 'spread' ? '#ffd27a' : '#bffcff', 140, -b.vx * 0.2, -b.vy * 0.2);
    return true;
  },
  update(dt) {
    const camX = Game.camX;
    const dmgEnemy = (e, d) => Enemies.damage(e, d);
    const dmgProp = (pr, d) => Props.damage(pr, d);
    for (const b of Pools.bullets) {
      if (!b.on) continue;
      b.life -= dt;
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.kind === 'flame') { b.vx *= Math.max(0, 1 - 2.2 * dt); b.vy = b.vy * Math.max(0, 1 - 2.2 * dt) - 60 * dt; b.r = 4 + (1 - b.life / b.max) * 12; }
      if (b.life <= 0 || b.x < camX - 30 || b.x > camX + View.viewW + 30 || b.y < -30 || b.y > CONFIG.world.height + 30) { b.on = false; continue; }
      if (Physics.pointInSolid(b.x, b.y)) {
        if (b.kind !== 'flame') FX.sparks(b.x, b.y, 4, b.owner === 'p' ? '#3ff6ff' : '#ff4dd2', 100);
        b.on = false; continue;
      }
      if (b.owner === 'p') {
        let gone = false;
        for (const e of Enemies.list) {
          if (e.dead || !this.hitBody(b, e)) continue;
          if (this.applyHit(b, e, dmgEnemy)) { gone = true; break; }
        }
        if (!gone) for (const pr of Props.list) {
          if (!pr.alive || !this.hitBody(b, pr)) continue;
          if (this.applyHit(b, pr, dmgProp)) { gone = true; break; }
        }
        if (!gone && Boss.active && !Boss.dying && this.hitBody(b, Boss)) {
          if (this.applyHit(b, Boss, (o, d) => Boss.damage(d))) gone = true;
        }
        if (gone) b.on = false;
      } else {
        const p = Player;
        if (!p.dead && this.hitBody(b, p)) {
          if (p.hurt(b.dmg, b.x - b.vx)) b.on = false;
        }
      }
    }
  },
  draw() {
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (const b of Pools.bullets) {
      if (!b.on) continue;
      if (b.owner !== 'p') {
        ctx.fillStyle = 'rgba(255,60,200,0.35)'; ctx.beginPath(); ctx.arc(b.x, b.y, 7, 0, 6.28); ctx.fill();
        ctx.fillStyle = '#ff7ae0'; ctx.beginPath(); ctx.arc(b.x, b.y, 3.6, 0, 6.28); ctx.fill();
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(b.x, b.y, 1.6, 0, 6.28); ctx.fill();
      } else if (b.kind === 'pulse') {
        const tx = b.x - b.vx * 0.022, ty = b.y - b.vy * 0.022;
        ctx.strokeStyle = 'rgba(63,246,255,0.35)'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();
        ctx.strokeStyle = '#e8ffff'; ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();
      } else if (b.kind === 'spread') {
        ctx.fillStyle = 'rgba(255,170,40,0.35)'; ctx.beginPath(); ctx.arc(b.x, b.y, 6.5, 0, 6.28); ctx.fill();
        ctx.fillStyle = '#ffe2a0'; ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, 6.28); ctx.fill();
      } else if (b.kind === 'laser') {
        const sp = Math.hypot(b.vx, b.vy) || 1, tx = b.x - b.vx / sp * b.len * 1.6, ty = b.y - b.vy / sp * b.len * 1.6;
        ctx.strokeStyle = 'rgba(255,60,210,0.35)'; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();
        ctx.strokeStyle = '#ffd0f6'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();
      } else if (b.kind === 'flame') {
        const k = b.life / b.max;
        ctx.globalAlpha = Math.min(1, k * 1.6);
        ctx.fillStyle = k > 0.6 ? 'rgba(255,230,140,0.55)' : (k > 0.3 ? 'rgba(255,120,30,0.45)' : 'rgba(200,40,60,0.35)');
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.28); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
    ctx.globalCompositeOperation = 'source-over';
  }
};

/* ============================ Props (caixas e cápsulas) ============================ */
const Props = {

          ctx.fillRect(-11, -32, 22, 26);

    } else if (it.type === 'ammo') {

      else { P.ammo = CONFIG.weapons[P.weapon].ammo; text = 'MUNIÇÃO'; sub = CONFIG.weapons[P.weapon].name + ' RECARREGADA'; Audio.play('pickup'); }

/* ============================ Bombas ============================ */
const Bombs = {
  list: [],
  spawn(x, y, vx, vy) { this.list.push({ x, y, vx, vy, w: 8, h: 8, bounces: 0, t: 0, onGround: false }); },
  explode(b) {
    const B = CONFIG.bombs;
    b.done = true;
    const cx = b.x, cy = b.y - 4;
    FX.explosion(cx, cy, 1.7);
    Game.addShake(7, 0.25);
    Game.hitStop = Math.max(Game.hitStop, CONFIG.fx.hitStop);
    Audio.play('bigexplode');
    const inR = o => { const dx = Math.max(Math.abs(o.x - cx) - o.w / 2, 0), oy = o.y - o.h / 2, dy = Math.max(Math.abs(oy - cy) - o.h / 2, 0); return dx * dx + dy * dy < B.radius * B.radius; };
    for (const e of Enemies.list) if (!e.dead && inR(e)) Enemies.damage(e, B.dmg, true);
    for (const pr of Props.list) if (pr.alive && inR(pr)) Props.damage(pr, B.dmg);
    if (Boss.active && !Boss.dying && inR(Boss)) Boss.damage(B.dmg);
    for (const bl of Pools.bullets) if (bl.on && bl.owner === 'e' && Math.hypot(bl.x - cx, bl.y - cy) < B.radius) bl.on = false;
  },
  update(dt) {
    const B = CONFIG.bombs;
    for (const b of this.list) {
      b.t += dt;
      const vyBefore = b.vy, vxBefore = b.vx;
      Physics.move(b, dt);
      if (b.hitWall) b.vx = -vxBefore * 0.35;
      if (b.onGround) {
        if (b.bounces === 0 && vyBefore > 60) { b.bounces = 1; b.vy = -vyBefore * B.bounce; b.vx *= 0.6; b.y -= 0.5; Audio.play('bounce'); }
        else { this.explode(b); continue; }
      }
      for (const e of Enemies.list) if (!e.dead && Util.overlap(b, e)) { this.explode(b); break; }
      if (!b.done && Boss.active && !Boss.dying && Util.overlap(b, Boss)) this.explode(b);
      if (!b.done && (b.t > B.fuse || b.y > CONFIG.world.height + 40)) this.explode(b);
    }
    this.list = this.list.filter(b => !b.done);
  },
  draw(t) {
    for (const b of this.list) {
      const x = b.x, y = b.y - 4;
      ctx.fillStyle = '#26303a'; ctx.beginPath(); ctx.arc(x, y, 4.5, 0, 6.28); ctx.fill();
      ctx.strokeStyle = '#ffb02e'; ctx.lineWidth = 1; ctx.stroke();
      if (Math.floor(b.t * 14) % 2 === 0) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = 'rgba(255,60,60,0.9)'; ctx.beginPath(); ctx.arc(x + 1.5, y - 1.5, 1.6, 0, 6.28); ctx.fill();
        ctx.fillStyle = 'rgba(255,60,60,0.3)'; ctx.beginPath(); ctx.arc(x + 1.5, y - 1.5, 5, 0, 6.28); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      }
    }
  }
};

/* ============================ Chefe: SENTINELA-ALPHA ============================ */
const Boss = {
  active: false, dying: false, shells: [], waves: [],
  spawn(x) {
    const C = CONFIG.boss;
    Object.assign(this, {
      active: true, dying: false, x, y: -80, vx: 0, vy: 0, w: C.w, h: C.h, hp: C.hp, maxHp: C.hp, name: C.name,
      facing: -1, state: 'intro', t: 0, flash: 0, flameCd: 0, last: null, shots: 0, shotT: 0, burstY: C.burst.highY,
      anim: 0, deathT: 0, expT: 0, introLanded: false, onGround: false
    });
    this.shells = []; this.waves = [];
    Game.boss = this;
  },
  reset() { this.active = false; this.dying = false; this.shells = []; this.waves = []; Game.boss = null; },
  damage(d) {
    if (!this.active || this.dying || this.state === 'intro') return;
    this.hp -= d; this.flash = 0.06;
    Audio.play('hit');
    if (this.hp <= 0) { this.hp = 0; this.die(); }
  },
  die() {
    this.dying = true; this.deathT = 2.4; this.expT = 0; this.vx = 0;
    Pools.clearBullets('e'); this.shells = []; this.waves = [];
  },
  face() { this.facing = Player.x < this.x ? -1 : 1; },
  chooseAttack() {
    const C = CONFIG.boss;
    const opts = ['burst', 'jump', 'mortar'].filter(a => a !== this.last);
    const a = opts[Math.floor(Math.random() * opts.length)];
    this.last = a; this.face(); this.vx = 0;
    if (a === 'burst') { this.state = 'burstTele'; this.t = C.burst.tele; this.burstY = Math.random() < 0.5 ? C.burst.highY : C.burst.lowY; Audio.play('warn'); }
    else if (a === 'jump') { this.state = 'jumpTele'; this.t = C.jump.tele; Audio.play('telegraph'); }
    else { this.state = 'mortarTele'; this.t = C.mortar.tele; Audio.play('telegraph'); }
  },
  cannonPivot() { return { x: this.x + this.facing * 22, y: this.y - 52 + this.crouchOff() }; },
  crouchOff() {
    if (this.state === 'jumpTele') return 10 * Math.min(1, (CONFIG.boss.jump.tele - this.t) / 0.2);
    if (this.state === 'recover') return 6 * Math.max(0, this.t / 0.6);
    return 0;
  },
  update(dt) {
    if (!this.active) return;
    const C = CONFIG.boss, D = Game.diff, p = Player, A = Level.arenaX, E = Level.arenaEnd, G = CONFIG.world.gravity, GY = CONFIG.world.groundY;
    this.flash = Math.max(0, this.flash - dt);
    this.flameCd = Math.max(0, this.flameCd - dt);
    this.anim += dt;
    if (this.dying) {
      this.deathT -= dt; this.expT -= dt;
      if (this.expT <= 0) {
        this.expT = 0.13;
        FX.explosion(this.x + Util.rand(-30, 30), this.y - Util.rand(10, 70), 0.8);
        Audio.play('explode'); Game.addShake(5, 0.15);
      }
      if (this.deathT <= 0) {
        for (let i = 0; i < 4; i++) FX.explosion(this.x + Util.rand(-25, 25), this.y - Util.rand(15, 60), 2);
        Audio.play('bigexplode'); Game.addShake(8, 0.5);
        this.active = false; Game.boss = null;
        Game.bossDefeated(this.x, this.y - this.h);
      }
      return;
    }
    // física simples (chão plano da arena)
    this.vy += G * dt; this.y += this.vy * dt; this.x += this.vx * dt;
    let landed = false;
    if (this.y >= GY) { if (this.vy > 200) landed = true; this.y = GY; this.vy = 0; this.onGround = true; } else this.onGround = false;
    this.x = Util.clamp(this.x, A + this.w / 2 + 4, E - this.w / 2 - 4);
    if (landed) {
      Game.addShake(7, 0.3); Audio.play('heavy');
      FX.dust(this.x - 24, GY, 6); FX.dust(this.x + 24, GY, 6);
    }
    this.t -= dt;
    switch (this.state) {
      case 'intro':
        if (this.onGround && !this.introLanded) { this.introLanded = true; this.t = 1.0; }
        if (this.introLanded && this.t <= 0) { this.state = 'idle'; this.t = 0.8; }
        break;
      case 'idle': {
        this.face();
        const dist = Math.abs(p.x - this.x);
        const want = dist < 140 ? -1 : (dist > 260 ? 1 : 0);
        this.vx = want * this.facing * C.walkSpeed * D.speedMul;
        if (this.t <= 0) this.chooseAttack();
        break;
      }
      case 'burstTele':
        if (this.t <= 0) { this.state = 'burst'; this.shots = C.burst.count; this.shotT = 0; }
        break;
      case 'burst':
        this.shotT -= dt;
        if (this.shotT <= 0 && this.shots > 0) {
          const pv = this.cannonPivot(), mx = pv.x + this.facing * 42, sp = C.burst.speed * D.speedMul;
          Pools.bullet({ x: mx, y: this.burstY, vx: this.facing * sp, vy: 0, life: 3, owner: 'e', dmg: CONFIG.enemyBulletDmg, r: 5 });
          Pools.particle({ x: mx, y: this.burstY, vx: 0, vy: 0, life: 0.08, color: '#ff4dd2', size: 10, kind: 'flash' });
          Audio.play('eshot');
          this.shots--; this.shotT = C.burst.gap / D.fireMul;
        }
        if (this.shots <= 0) { this.state = 'idle'; this.t = C.idleTime / D.fireMul; }
        break;
      case 'jumpTele':
        if (this.t <= 0) {
          const tx = Util.clamp(p.x, A + 50, E - 50), T = C.jump.airTime / Math.max(0.85, D.speedMul);
          this.state = 'jumping'; this.vy = -G * T / 2; this.vx = (tx - this.x) / T; this.y -= 1;
          Audio.play('jump');
        }
        break;
      case 'jumping':
        if (landed) {
          this.vx = 0; this.state = 'recover'; this.t = 0.6;
          const sp = C.wave.speed * D.speedMul;
          this.waves.push({ x: this.x - 30, dir: -1, sp }, { x: this.x + 30, dir: 1, sp });
        }
        break;
      case 'recover':
        this.vx = 0;
        if (this.t <= 0) { this.state = 'idle'; this.t = C.idleTime / D.fireMul; }
        break;
      case 'mortarTele':
        if (this.t <= 0) { this.state = 'mortar'; this.shots = 3; this.shotT = 0; }
        break;
      case 'mortar':
        this.shotT -= dt;
        if (this.shotT <= 0 && this.shots > 0) {
          const off = [-1, 0, 1][3 - this.shots] * C.mortar.spacing;
          const tx = Util.clamp(p.x + off, A + 20, E - 20);
          const x0 = this.x - this.facing * 6, y0 = this.y - this.h - 10, T = C.mortar.flight;
          this.shells.push({ x: x0, y: y0, vx: (tx - x0) / T, vy: (GY - y0 - 0.5 * G * T * T) / T, tx, t: T, max: T });
          Pools.particle({ x: x0, y: y0, vx: 0, vy: 0, life: 0.1, color: '#ffb02e', size: 10, kind: 'flash' });
          Audio.play('throw');
          this.shots--; this.shotT = 0.28 / D.fireMul;
        }
        if (this.shots <= 0) { this.state = 'idle'; this.t = C.idleTime / D.fireMul + 0.3; }
        break;
    }
    // projéteis do morteiro
    for (const s of this.shells) {
      s.t -= dt; s.vy += G * dt; s.x += s.vx * dt; s.y += s.vy * dt;
      if (s.y >= GY - 2) {
        s.done = true;
        FX.explosion(s.x, GY - 6, 0.7); Audio.play('explode'); Game.addShake(3, 0.12);
        const r = C.mortar.radius;
        const dx = Math.max(Math.abs(p.x - s.x) - p.w / 2, 0), dy = Math.max((GY - 6) - p.y, 0, (p.y - p.h) - (GY - 6));
        if (!p.dead && dx * dx + dy * dy < r * r) p.hurt(1, s.x);
      }
    }
    this.shells = this.shells.filter(s => !s.done);
    // ondas de choque
    for (const w of this.waves) {
      w.x += w.dir * w.sp * dt;
      if (w.x < A || w.x > E) w.done = true;
      if (Math.random() < 0.6) Pools.particle({ x: w.x, y: GY - 2, vx: Util.rand(-20, 20), vy: Util.rand(-90, -30), life: 0.3, color: '#ffb02e', size: 1.5, kind: 'spark', grav: 300 });
      if (!p.dead && p.y > GY - C.wave.h && Math.abs(p.x - w.x) < C.wave.w / 2 + p.w / 2) p.hurt(1, w.x - w.dir * 10);
    }
    this.waves = this.waves.filter(w => !w.done);
    // contato
    if (!p.dead && this.state !== 'intro' && Util.overlap(this, p)) p.hurt(C.contactDmg, this.x);
  },
  draw(t) {
    // avisos (desenhados mesmo após a morte dos projéteis)
    const C = CONFIG.boss, GY = CONFIG.world.groundY;
    for (const s of this.shells) {
      const k = 1 - s.t / s.max;
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = `rgba(255,60,60,${0.5 + 0.5 * Math.sin(t * 30)})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(s.tx, GY - 1, C.mortar.radius * (1.3 - k * 0.3), 5, 0, 0, 6.28); ctx.stroke();
      ctx.fillStyle = 'rgba(255,60,60,0.18)'; ctx.beginPath(); ctx.ellipse(s.tx, GY - 1, C.mortar.radius * k, 4 * k, 0, 0, 6.28); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#2b2e3d'; ctx.beginPath(); ctx.arc(s.x, s.y, 5, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#ffb02e'; ctx.beginPath(); ctx.arc(s.x, s.y, 2, 0, 6.28); ctx.fill();
    }
    ctx.globalCompositeOperation = 'lighter';
    for (const w of this.waves) {
      ctx.fillStyle = 'rgba(255,150,40,0.35)';
      ctx.beginPath(); ctx.moveTo(w.x - 14, GY); ctx.quadraticCurveTo(w.x, GY - C.wave.h * 1.8, w.x + 14, GY); ctx.fill();
      ctx.fillStyle = 'rgba(255,230,160,0.8)';
      ctx.beginPath(); ctx.moveTo(w.x - 6, GY); ctx.quadraticCurveTo(w.x, GY - C.wave.h, w.x + 6, GY); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    if (!this.active) return;
    // linha de aviso da rajada
    if (this.state === 'burstTele' && Math.floor(t * 16) % 2 === 0) {
      ctx.strokeStyle = 'rgba(255,42,109,0.75)'; ctx.lineWidth = 1.5; ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.moveTo(Level.arenaX, this.burstY); ctx.lineTo(Level.arenaEnd, this.burstY); ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center'; ctx.fillStyle = '#ff9ab0';
      ctx.fillText(this.burstY === C.burst.highY ? 'AGACHE!' : 'PULE!', this.x - this.facing * 10, this.y - this.h - 22);
    }
    const fl = this.flash > 0 || (this.dying && Math.floor(t * 20) % 2 === 0);
    const co = this.crouchOff();
    const shake = this.dying ? Util.rand(-2, 2) : 0;
    ctx.save();
    ctx.translate(this.x + shake, this.y);
    ctx.scale(this.facing, 1);
    const walk = Math.abs(this.vx) > 2 && this.onGround ? Math.sin(this.anim * 7) : 0;
    const dark = fl ? '#fff' : '#2b2e3d', body = fl ? '#fff' : '#4a4f63', plate = fl ? '#fff' : '#5c6278';
    // pernas (articulação invertida)
    const leg = (hx, ph) => {
      const hy = -38 + co;
      const kx = hx + 10 + ph * 4, ky = -20 + co * 0.5, fx = hx + ph * 6, fy = this.onGround ? -2 : -6;
      ctx.strokeStyle = dark; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
      ctx.fillStyle = plate; ctx.beginPath(); ctx.arc(kx, ky, 4.5, 0, 6.28); ctx.fill();
      ctx.fillStyle = dark; ctx.fillRect(fx - 10, fy - 2, 20, 4);
    };
    leg(-16, -walk); leg(12, walk);
    // casco
    const hy = -78 + co;
    ctx.fillStyle = body; Util.rr(ctx, -33, hy, 66, 42, 8); ctx.fill();
    ctx.fillStyle = plate; Util.rr(ctx, -28, hy + 4, 40, 12, 4); ctx.fill();
    ctx.fillStyle = dark; ctx.fillRect(-33, hy + 30, 66, 5);
    if (!fl) {
      ctx.strokeStyle = '#d23cff'; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(-24, hy + 20); ctx.lineTo(-14, hy + 26); ctx.lineTo(-18, hy + 33); ctx.moveTo(0, hy + 18); ctx.lineTo(8, hy + 24); ctx.stroke();
      ctx.fillStyle = '#ffb02e';
      for (let i = 0; i < 4; i++) ctx.fillRect(-30 + i * 9, hy + 31, 4, 3);
    }
    // sensor
    const tele = this.state.endsWith('Tele');
    ctx.fillStyle = '#ff2a6d'; Util.rr(ctx, 16, hy + 8, 13, 6, 2); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = `rgba(255,42,109,${tele ? 0.5 + 0.4 * Math.sin(t * 40) : 0.25})`;
    ctx.beginPath(); ctx.arc(23, hy + 11, tele ? 12 : 7, 0, 6.28); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    // morteiro superior
    ctx.save(); ctx.translate(-10, hy); ctx.rotate(-0.5);
    ctx.fillStyle = dark; ctx.fillRect(-6, -16, 12, 18);
    ctx.fillStyle = '#ffb02e'; ctx.fillRect(-5, -18, 10, 3);
    if (this.state === 'mortarTele' || this.state === 'mortar') {
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `rgba(255,176,46,${0.4 + 0.4 * Math.sin(t * 30)})`; ctx.beginPath(); ctx.arc(0, -17, 9, 0, 6.28); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
    // canhão duplo
    const pv = this.cannonPivot();
    const ang = (this.state === 'burstTele' || this.state === 'burst') ? Math.atan2(this.burstY - pv.y, 42) : 0.12;
    ctx.save(); ctx.translate(22, -52 + co); ctx.rotate(ang);
    ctx.fillStyle = plate; Util.rr(ctx, -8, -10, 18, 20, 4); ctx.fill();
    ctx.fillStyle = dark; ctx.fillRect(6, -7, 36, 5); ctx.fillRect(6, 2, 36, 5);
    ctx.fillStyle = '#ff4dd2'; ctx.fillRect(39, -7, 3, 5); ctx.fillRect(39, 2, 3, 5);
    if (this.state === 'burstTele') {
      const k = 1 - this.t / C.burst.tele;
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `rgba(255,77,210,${0.3 + 0.6 * k})`; ctx.beginPath(); ctx.arc(44, 0, 4 + k * 10, 0, 6.28); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
    if (this.state === 'jumpTele' && Math.floor(t * 20) % 2 === 0) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,150,40,0.3)'; ctx.fillRect(-36, -6, 72, 6);
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
  }
};
