/* ============================ Util ============================ */
const Util = {
  clamp: (v, a, b) => v < a ? a : (v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  rand: (a, b) => a + Math.random() * (b - a),
  approach(v, t, d) { return v < t ? Math.min(v + d, t) : Math.max(v - d, t); },
  mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
  rr(ctx, x, y, w, h, r) { // roundRect seguro
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  },
  overlap(a, b) { // corpos com x central e y nos pés
    return a.x + a.w / 2 > b.x - b.w / 2 && a.x - a.w / 2 < b.x + b.w / 2 && a.y > b.y - b.h && a.y - a.h < b.y;
  }
};

/* ============================ Audio ============================ */
const Audio = {
  ctx: null, master: null, sfx: null, noiseBuf: null, voices: 0, muted: false, last: {},
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} } return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : CONFIG.audio.master;
      this.master.connect(this.ctx.destination);
      this.sfx = this.ctx.createGain();
      this.sfx.gain.value = CONFIG.audio.sfx;
      this.sfx.connect(this.master);
      const len = Math.floor(this.ctx.sampleRate * 1.0);
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : CONFIG.audio.master, this.ctx.currentTime, 0.02);
  },
  ok() { return this.ctx && this.ctx.state === 'running' && !this.muted && this.voices < CONFIG.audio.maxVoices; },
  tone(type, f0, f1, dur, vol, delay = 0) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.sfx);
    this.voices++; o.onended = () => { this.voices--; };
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, ftype, f0, f1, delay = 0) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime + delay;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf;
    f.type = ftype; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.sfx);
    this.voices++; s.onended = () => { this.voices--; };
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  },
  play(name) {
    if (!this.ctx) return;
    const now = performance.now();
    const minGap = { mg: 70, step: 120, metal: 60, shoot: 45, eshot: 60, hit: 35, step: 90, flame: 70, spread: 60, laser: 60, bounce: 50 }[name] || 0;
    if (minGap && this.last[name] && now - this.last[name] < minGap) return;
    this.last[name] = now;
    switch (name) {
      case 'shoot': this.tone('square', 900, 260, 0.07, 0.10); this.noise(0.04, 0.05, 'highpass', 3000, 1500); break;
      case 'eshot': this.tone('sawtooth', 420, 140, 0.14, 0.07); break;
      case 'telegraph': this.tone('sine', 700, 1400, 0.18, 0.05); break;
      case 'hit': this.noise(0.05, 0.10, 'bandpass', 2500, 900); this.tone('square', 300, 160, 0.04, 0.04); break;
      case 'explode': this.noise(0.45, 0.30, 'lowpass', 2200, 80); this.tone('sine', 140, 35, 0.35, 0.28); break;
      case 'jump': this.tone('sine', 260, 620, 0.12, 0.08); break;
      case 'land': this.noise(0.06, 0.05, 'lowpass', 600, 120); break;
      case 'dash': this.noise(0.22, 0.14, 'bandpass', 600, 4000); this.tone('sawtooth', 160, 520, 0.16, 0.05); break;
      case 'hurt': this.tone('square', 240, 70, 0.25, 0.12); this.noise(0.15, 0.12, 'lowpass', 1500, 200); break;
      case 'ui': this.tone('triangle', 660, 990, 0.08, 0.08); break;
      case 'start': this.tone('triangle', 440, 440, 0.1, 0.08); this.tone('triangle', 660, 660, 0.1, 0.08, 0.1); this.tone('triangle', 880, 880, 0.2, 0.09, 0.2); break;
      case 'spread': this.tone('square', 620, 180, 0.1, 0.08); this.noise(0.08, 0.08, 'bandpass', 1800, 600); break;
      case 'laser': this.tone('sawtooth', 1800, 300, 0.14, 0.07); this.tone('sine', 2400, 900, 0.1, 0.05); break;
      case 'flame': this.noise(0.12, 0.09, 'lowpass', 1400, 500); break;
      case 'knife': this.noise(0.12, 0.16, 'highpass', 2000, 6000); this.tone('sawtooth', 900, 2200, 0.08, 0.06); break;
      case 'throw': this.tone('triangle', 300, 180, 0.12, 0.07); break;
      case 'bounce': this.tone('square', 180, 120, 0.05, 0.05); break;
      case 'bigexplode': this.noise(0.7, 0.4, 'lowpass', 3000, 50); this.tone('sine', 110, 25, 0.6, 0.35); break;
      case 'pickup': this.tone('square', 660, 660, 0.06, 0.07); this.tone('square', 990, 990, 0.1, 0.07, 0.06); break;
      case 'weapon': this.tone('sawtooth', 220, 440, 0.15, 0.08); this.tone('square', 440, 880, 0.2, 0.07, 0.12); this.tone('triangle', 880, 1320, 0.25, 0.07, 0.25); break;
      case 'glass': this.noise(0.25, 0.18, 'highpass', 4000, 1500); this.tone('sine', 1800, 1200, 0.2, 0.05); break;
      case 'crate': this.noise(0.18, 0.2, 'bandpass', 800, 200); this.tone('square', 160, 60, 0.12, 0.08); break;
      case 'empty': this.tone('triangle', 400, 200, 0.15, 0.06); break;
      case 'warn': this.tone('square', 880, 880, 0.12, 0.07); this.tone('square', 660, 660, 0.12, 0.07, 0.15); this.tone('square', 880, 880, 0.12, 0.07, 0.3); break;
      case 'heavy': this.noise(0.35, 0.3, 'lowpass', 700, 40); this.tone('sine', 90, 30, 0.3, 0.3); break;
      case 'checkpoint': this.tone('triangle', 523, 523, 0.1, 0.08); this.tone('triangle', 784, 784, 0.18, 0.08, 0.1); break;
      case 'select': this.tone('triangle', 520, 520, 0.05, 0.06); break;
      case 'gameover': this.tone('sawtooth', 330, 320, 0.3, 0.08); this.tone('sawtooth', 262, 250, 0.3, 0.08, 0.3); this.tone('sawtooth', 196, 120, 0.7, 0.09, 0.6); break;
      case 'victory': [523, 659, 784, 1047].forEach((f, i) => this.tone('square', f, f, 0.16, 0.07, i * 0.13)); this.tone('triangle', 1047, 1047, 0.5, 0.08, 0.55); break;
      case 'mg': this.tone('square', 220, 90, 0.06, 0.09); this.noise(0.05, 0.1, 'bandpass', 1500, 500); break;
      case 'step': this.tone('sine', 70, 40, 0.12, 0.18); this.noise(0.08, 0.08, 'lowpass', 400, 80); break;
      case 'metal': this.tone('square', 520, 260, 0.08, 0.07); this.noise(0.06, 0.1, 'highpass', 3000, 2000); break;
      case 'missile': this.noise(0.4, 0.12, 'bandpass', 900, 2800); this.tone('sawtooth', 200, 500, 0.25, 0.04); break;
      case 'mechOn': this.tone('sawtooth', 110, 330, 0.3, 0.07); this.tone('square', 660, 990, 0.15, 0.06, 0.3); break;
      case 'mechOff': this.tone('sawtooth', 330, 110, 0.25, 0.06); break;
      case 'death': this.tone('sawtooth', 500, 40, 0.9, 0.12); this.noise(0.8, 0.25, 'lowpass', 3000, 60); break;
    }
  }
};

/* ============================ View / Render ============================ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });

const View = {
  W: 1, H: 1, dpr: 1, scale: 1, viewW: 640, gx: 0, gy: 0, gw: 1, gh: 1, portrait: false,
  safe: { t: 0, r: 0, b: 0, l: 0 },
  readSafe() {
    try {
      const cs = getComputedStyle(document.getElementById('sa'));
      this.safe = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
    } catch (e) { this.safe = { t: 0, r: 0, b: 0, l: 0 }; }
  },
  resize() {
    const vv = window.visualViewport;
    const W = Math.max(1, Math.round(vv ? vv.width : window.innerWidth));
    const H = Math.max(1, Math.round(vv ? vv.height : window.innerHeight));
    this.W = W; this.H = H;
    this.dpr = Math.min(CONFIG.render.maxDpr, window.devicePixelRatio || 1);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    canvas.width = Math.round(W * this.dpr); canvas.height = Math.round(H * this.dpr);
    this.readSafe();
    const WH = CONFIG.world.height, cw = CONFIG.world;
    this.portrait = H > W;
    if (!this.portrait) {
      let scale = H / WH, vw = W / scale;
      if (vw > cw.maxW) vw = cw.maxW;
      if (vw < cw.minW) { vw = cw.minW; scale = W / vw; }
      this.scale = scale; this.viewW = vw;
      this.gw = vw * scale; this.gh = WH * scale;
      this.gx = (W - this.gw) / 2; this.gy = (H - this.gh) / 2;
    } else {
      let vw = cw.portraitW, scale = W / vw;
      let gy = this.safe.t, gh = WH * scale;
      const minStrip = 240;
      if (H - gy - gh < minStrip) { gh = Math.max(140, H - gy - minStrip); scale = gh / WH; }
      this.scale = scale; this.viewW = vw;
      this.gw = vw * scale; this.gh = WH * scale;
      this.gx = (W - this.gw) / 2; this.gy = gy;
    }
    UI.layout();
    Render.buildBackgrounds();
  }
};

    c.width = Math.ceil(this.TW * r); c.height = Math.ceil(CONFIG.world.height * r);
    const g = c.getContext('2d');
    g.scale(r, r);
    drawFn(g, Util.mulberry(seed));
    return c;
  },

  theme: 1,

         ground: ['#211b19', '#131011', '#070606'], edgeGlow: 'rgba(255,140,40,0.18)', edge: 'rgba(255,170,80,0.95)', groundLines: 'rgba(130,95,60,0.45)',
