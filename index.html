      return;
    }
    const moveTo = (tx, sp) => { this.vx = Util.clamp((tx - this.x) * 3, -sp, sp); };
    this.y = C.flyY + Math.sin(this.anim * 2.2) * 6;
    this.t -= dt;
    switch (this.state) {
      case 'intro':
        moveTo(this.targetX, 170);
        if (Math.abs(this.x - this.targetX) < 5) { this.state = 'idle'; this.t = 0.8; }
        break;
      case 'idle': {
        const tx = this.patrolDir < 0 ? A + 110 : E - 110;
        moveTo(tx, C.speed * D.speedMul);
        if (Math.abs(this.x - tx) < 8) this.patrolDir *= -1;
        if (this.t <= 0) this.chooseVortex();
        break;
      }
      case 'mineTele':
        this.vx *= Math.max(0, 1 - 4 * dt);
        if (this.t <= 0) { this.state = 'mine'; this.shots = C.mine.count; this.shotT = 0; }
        break;
      case 'mine': {
        const tx = this.patrolDir < 0 ? A + 110 : E - 110;
        moveTo(tx, C.speed * 0.8 * D.speedMul);
        if (Math.abs(this.x - tx) < 8) this.patrolDir *= -1;
        this.shotT -= dt;
        if (this.shotT <= 0 && this.shots > 0) {
          this.mines.push({ x: this.x, y: this.y + 6, vx: this.vx * 0.3 + Util.rand(-60, 60), vy: 30, bounces: 0, fuse: C.mine.fuse, t: 0, w: 10, h: 10 });
          this.shots--; this.shotT = C.mine.gap / D.fireMul; Audio.play('throw');
        }
        if (this.shots <= 0) { this.state = 'idle'; this.t = C.idleTime / D.fireMul; }
        break;
      }
      case 'rayTele':
        moveTo(this.rayX, 280 * D.speedMul);
        if (this.t <= 0) { this.state = 'rayFire'; this.t = C.ray.active; Audio.play('laser'); Audio.play('heavy'); Game.addShake(3, 0.2); }
        break;
      case 'rayFire':
        this.vx = 0;
        if (Math.random() < 0.8) Pools.particle({ x: this.rayX + Util.rand(-8, 8), y: GY - 2, vx: Util.rand(-120, 120), vy: Util.rand(-200, -60), life: 0.35, color: '#ffb02e', size: 1.6, kind: 'spark', grav: 500 });
        if (!p.dead && Math.abs(p.x - this.rayX) < C.ray.width / 2 + p.w / 2) p.hurt(1, this.rayX);
        if (this.t <= 0) {
          this.shots--;
          if (this.shots > 0) { this.state = 'rayTele'; this.t = C.ray.warn; this.rayX = Util.clamp(p.x, A + 20, E - 20); Audio.play('telegraph'); }
          else { this.state = 'idle'; this.t = C.idleTime / D.fireMul; }
        }
        break;
      case 'sprayTele':
        this.vx *= Math.max(0, 1 - 4 * dt);
        if (this.t <= 0) {
          const gx = this.x, gy = this.y;
          const base = Math.atan2((p.y - 16) - gy, p.x - gx), sp = C.spray.speed * D.speedMul;
          for (let i = 0; i < C.spray.count; i++) {
            const a = base + (i - (C.spray.count - 1) / 2) * C.spray.spreadA;
            Pools.bullet({ x: gx, y: gy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 3.5, owner: 'e', dmg: CONFIG.enemyBulletDmg, r: 5 });
          }
          Pools.particle({ x: gx, y: gy, vx: 0, vy: 0, life: 0.1, color: '#ff4dd2', size: 12, kind: 'flash' });
          Audio.play('eshot');
          this.state = 'idle'; this.t = C.idleTime / D.fireMul;
        }
        break;
    }
    this.x += this.vx * dt;
    if (this.state !== 'intro') this.x = Util.clamp(this.x, A + this.w / 2, E - this.w / 2);
    // minas: caem, quicam e explodem
    for (const m of this.mines) {
      m.t += dt; m.fuse -= dt;
      m.vy += G * dt; m.x += m.vx * dt; m.y += m.vy * dt;
      if (m.y >= GY) {
        m.y = GY;
        if (m.bounces < C.mine.bounces && m.vy > 80) { m.vy = -m.vy * C.mine.bounce; m.bounces++; m.vx *= 0.85; Audio.play('bounce'); }
        else { m.vy = 0; m.vx *= Math.max(0, 1 - 4 * dt); }
      }
      if (m.x < A + 6 || m.x > E - 6) { m.vx = -m.vx; m.x = Util.clamp(m.x, A + 6, E - 6); }
      if (m.fuse <= 0) { this.explodeMine(m, true); continue; }
      if (!p.dead && Util.overlap(m, p)) { this.explodeMine(m, true); continue; }
      for (const b of Pools.bullets) {
        if (b.on && b.owner === 'p' && Math.abs(b.x - m.x) < 7 + b.r && Math.abs(b.y - (m.y - 5)) < 7 + b.r) {
          if (!b.pierce) b.on = false;
          this.explodeMine(m, false); Game.addScore(20, m.x, m.y - 12); break;
        }
      }
    }
    this.mines = this.mines.filter(m => !m.done);
    if (!p.dead && this.state !== 'intro' && Util.overlap(this, p)) p.hurt(C.contactDmg, this.x);
  },
  drawVortex(t) {
    const C = CONFIG.vortex, GY = CONFIG.world.groundY;
    // minas
    for (const m of this.mines) {
      const y = m.y - 5;
      ctx.strokeStyle = '#6a7690'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let i = 0; i < 4; i++) { const a = i * Math.PI / 4 + m.t * 3; ctx.moveTo(m.x + Math.cos(a) * 3, y + Math.sin(a) * 3); ctx.lineTo(m.x + Math.cos(a) * 8, y + Math.sin(a) * 8); ctx.moveTo(m.x - Math.cos(a) * 3, y - Math.sin(a) * 3); ctx.lineTo(m.x - Math.cos(a) * 8, y - Math.sin(a) * 8); }
      ctx.stroke();
      ctx.fillStyle = '#2a2f45'; ctx.beginPath(); ctx.arc(m.x, y, 5.5, 0, 6.28); ctx.fill();
      const blink = Math.floor(m.t * (m.fuse < 1 ? 16 : 5)) % 2 === 0;
      if (blink) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = 'rgba(255,60,40,0.9)'; ctx.beginPath(); ctx.arc(m.x, y, 2, 0, 6.28); ctx.fill();
        ctx.fillStyle = 'rgba(255,60,40,0.25)'; ctx.beginPath(); ctx.arc(m.x, y, C.mine.radius * (m.fuse < 1 ? 0.7 : 0.25), 0, 6.28); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      }
    }
    if (!this.active) return;
    // aviso / disparo do raio vertical
    if (this.state === 'rayTele') {
      const k = 1 - this.t / C.ray.warn;
      if (Math.floor(t * 18) % 2 === 0) {
        ctx.strokeStyle = 'rgba(255,140,40,0.85)'; ctx.lineWidth = 1.5; ctx.setLineDash([6, 5]);
        ctx.beginPath(); ctx.moveTo(this.rayX - C.ray.width / 2, this.y); ctx.lineTo(this.rayX - C.ray.width / 2, GY);
        ctx.moveTo(this.rayX + C.ray.width / 2, this.y); ctx.lineTo(this.rayX + C.ray.width / 2, GY); ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `rgba(255,120,40,${0.1 + 0.25 * k})`; ctx.fillRect(this.rayX - 2 - k * 4, this.y, 4 + k * 8, GY - this.y);
      ctx.fillStyle = `rgba(255,120,40,${0.3 + 0.3 * Math.sin(t * 30)})`; ctx.beginPath(); ctx.ellipse(this.rayX, GY, C.ray.width * 0.8, 4, 0, 0, 6.28); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center'; ctx.fillStyle = '#ffd0a0'; ctx.fillText('!', this.rayX, GY - 12);
    } else if (this.state === 'rayFire') {
      const w = C.ray.width * (0.85 + Math.random() * 0.3);
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,120,40,0.45)'; ctx.fillRect(this.rayX - w / 2 - 4, this.y, w + 8, GY - this.y);
      ctx.fillStyle = 'rgba(255,210,140,0.85)'; ctx.fillRect(this.rayX - w / 4, this.y, w / 2, GY - this.y);
      ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fillRect(this.rayX - 2, this.y, 4, GY - this.y);
      ctx.globalCompositeOperation = 'source-over';
    }
    // nave
    const fl = this.flash > 0 || (this.dying && Math.floor(t * 20) % 2 === 0);
    const cy = this.y - this.h / 2;
    ctx.save();
    ctx.translate(this.x + (this.dying ? Util.rand(-2, 2) : 0), cy);
    ctx.rotate(Util.clamp(this.vx * 0.0018, -0.25, 0.25));
    // anéis do vórtice
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(80,170,255,0.55)'; ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const a0 = this.anim * 3 + i * Math.PI / 3;
      ctx.beginPath(); ctx.ellipse(0, 2, 58, 13, 0, a0, a0 + 0.6); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
    // motores laterais
    for (const sx of [-1, 1]) {
      ctx.fillStyle = fl ? '#fff' : '#2a3448'; Util.rr(ctx, sx * 40 - 9, -6, 18, 16, 4); ctx.fill();
      ctx.globalCompositeOperation = 'lighter';
      const fh = 8 + Math.random() * 6;
      ctx.fillStyle = 'rgba(90,190,255,0.8)'; ctx.beginPath(); ctx.moveTo(sx * 40 - 5, 10); ctx.lineTo(sx * 40, 10 + fh); ctx.lineTo(sx * 40 + 5, 10); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    // casco
    ctx.fillStyle = fl ? '#fff' : '#4a3424'; ctx.beginPath(); ctx.ellipse(0, 2, 44, 13, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = fl ? '#fff' : '#6a4a30'; ctx.beginPath(); ctx.ellipse(0, -5, 24, 11, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#ff8a2a'; ctx.fillRect(-36, 1, 72, 2);
    if (!fl) { ctx.strokeStyle = '#d23cff'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-20, -2); ctx.lineTo(-12, 5); ctx.lineTo(-16, 10); ctx.moveTo(14, -1); ctx.lineTo(20, 6); ctx.stroke(); }
    // olho central
    const tele = this.state.endsWith('Tele');
    ctx.fillStyle = '#ff2a6d'; ctx.beginPath(); ctx.arc(0, -6, 4, 0, 6.28); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = `rgba(255,42,109,${tele ? 0.5 + 0.4 * Math.sin(t * 40) : 0.25})`; ctx.beginPath(); ctx.arc(0, -6, tele ? 13 : 8, 0, 6.28); ctx.fill();
    // escotilha das minas / emissor do raio
    if (this.state === 'mineTele' || this.state === 'mine') { ctx.fillStyle = `rgba(255,80,40,${0.5 + 0.4 * Math.sin(t * 30)})`; ctx.fillRect(-8, 11, 16, 5); }
    if (this.state === 'rayTele' || this.state === 'rayFire') { ctx.fillStyle = `rgba(255,170,60,${this.state === 'rayFire' ? 0.9 : 0.4 + 0.4 * Math.sin(t * 30)})`; ctx.beginPath(); ctx.arc(0, 14, 7, 0, 6.28); ctx.fill(); }
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
  },

  face() { this.facing = Player.x < this.x ? -1 : 1; },
  chooseAttack() {
    const C = CONFIG.boss;
    const opts = ['burst', 'jump', 'mortar'].filter(a => a !== this.last);
    const a = opts[Math.floor(Math.random() * opts.length)];
    this.last = a; this.face(); this.vx = 0;
    if (a === 'burst') { this.state = 'burstTele'; this.t = C.burst.tele; this.burstY = Math.random() < 0.5 ? C.burst.highY : C.burst.lowY; Audio.play('warn'); }
    else if (a === 'jump') { this.state = 'jumpTele'; this.t = C.jump.tele; Audio.play('telegraph'); }
    else { this.state = 'mortarTele'; this.t = C.mortar.tele; Audio.play('telegraph'); }
  },
  cannonPivot() { return { x: this.x + this.facing * 22, y: this.y - 52 + this.crouchOff() }; },
  crouchOff() {
    if (this.state === 'jumpTele') return 10 * Math.min(1, (CONFIG.boss.jump.tele - this.t) / 0.2);
    if (this.state === 'recover') return 6 * Math.max(0, this.t / 0.6);
    return 0;
  },
  updateSentinela(dt) {
    if (!this.active) return;
    const C = CONFIG.boss, D = Game.diff, p = Player, A = Level.arenaX, E = Level.arenaEnd, G = CONFIG.world.gravity, GY = CONFIG.world.groundY;
    this.flash = Math.max(0, this.flash - dt);
    this.flameCd = Math.max(0, this.flameCd - dt);
    this.anim += dt;
    if (this.dying) {
      this.deathT -= dt; this.expT -= dt;
      if (this.expT <= 0) {
        this.expT = 0.13;
        FX.explosion(this.x + Util.rand(-30, 30), this.y - Util.rand(10, 70), 0.8);
        Audio.play('explode'); Game.addShake(5, 0.15);
      }
      if (this.deathT <= 0) {
        for (let i = 0; i < 4; i++) FX.explosion(this.x + Util.rand(-25, 25), this.y - Util.rand(15, 60), 2);
        Audio.play('bigexplode'); Game.addShake(8, 0.5);
        this.active = false; Game.boss = null;
        Game.bossDefeated(this.x, this.y - this.h);
      }
      return;
    }
    // física simples (chão plano da arena)
    this.vy += G * dt; this.y += this.vy * dt; this.x += this.vx * dt;
    let landed = false;
    if (this.y >= GY) { if (this.vy > 200) landed = true; this.y = GY; this.vy = 0; this.onGround = true; } else this.onGround = false;
    this.x = Util.clamp(this.x, A + this.w / 2 + 4, E - this.w / 2 - 4);
    if (landed) {
      Game.addShake(7, 0.3); Audio.play('heavy');
      FX.dust(this.x - 24, GY, 6); FX.dust(this.x + 24, GY, 6);
    }
    this.t -= dt;
    switch (this.state) {
      case 'intro':
        if (this.onGround && !this.introLanded) { this.introLanded = true; this.t = 1.0; }
        if (this.introLanded && this.t <= 0) { this.state = 'idle'; this.t = 0.8; }
        break;
      case 'idle': {
        this.face();
        const dist = Math.abs(p.x - this.x);
        const want = dist < 140 ? -1 : (dist > 260 ? 1 : 0);
        this.vx = want * this.facing * C.walkSpeed * D.speedMul;
        if (this.t <= 0) this.chooseAttack();
        break;
      }
      case 'burstTele':
        if (this.t <= 0) { this.state = 'burst'; this.shots = C.burst.count; this.shotT = 0; }
        break;
      case 'burst':
        this.shotT -= dt;
        if (this.shotT <= 0 && this.shots > 0) {
          const pv = this.cannonPivot(), mx = pv.x + this.facing * 42, sp = C.burst.speed * D.speedMul;
          Pools.bullet({ x: mx, y: this.burstY, vx: this.facing * sp, vy: 0, life: 3, owner: 'e', dmg: CONFIG.enemyBulletDmg, r: 5 });
          Pools.particle({ x: mx, y: this.burstY, vx: 0, vy: 0, life: 0.08, color: '#ff4dd2', size: 10, kind: 'flash' });
          Audio.play('eshot');
          this.shots--; this.shotT = C.burst.gap / D.fireMul;
        }
        if (this.shots <= 0) { this.state = 'idle'; this.t = C.idleTime / D.fireMul; }
        break;
      case 'jumpTele':
        if (this.t <= 0) {
          const tx = Util.clamp(p.x, A + 50, E - 50), T = C.jump.airTime / Math.max(0.85, D.speedMul);
          this.state = 'jumping'; this.vy = -G * T / 2; this.vx = (tx - this.x) / T; this.y -= 1;
          Audio.play('jump');
        }
        break;
      case 'jumping':
        if (landed) {
          this.vx = 0; this.state = 'recover'; this.t = 0.6;
          const sp = C.wave.speed * D.speedMul;
          this.waves.push({ x: this.x - 30, dir: -1, sp }, { x: this.x + 30, dir: 1, sp });
        }
        break;
      case 'recover':
        this.vx = 0;
        if (this.t <= 0) { this.state = 'idle'; this.t = C.idleTime / D.fireMul; }
        break;
      case 'mortarTele':
        if (this.t <= 0) { this.state = 'mortar'; this.shots = 3; this.shotT = 0; }
        break;
      case 'mortar':
        this.shotT -= dt;
        if (this.shotT <= 0 && this.shots > 0) {
          const off = [-1, 0, 1][3 - this.shots] * C.mortar.spacing;
          const tx = Util.clamp(p.x + off, A + 20, E - 20);
          const x0 = this.x - this.facing * 6, y0 = this.y - this.h - 10, T = C.mortar.flight;
          this.shells.push({ x: x0, y: y0, vx: (tx - x0) / T, vy: (GY - y0 - 0.5 * G * T * T) / T, tx, t: T, max: T });
          Pools.particle({ x: x0, y: y0, vx: 0, vy: 0, life: 0.1, color: '#ffb02e', size: 10, kind: 'flash' });
          Audio.play('throw');
          this.shots--; this.shotT = 0.28 / D.fireMul;
        }
        if (this.shots <= 0) { this.state = 'idle'; this.t = C.idleTime / D.fireMul + 0.3; }
        break;
    }
    // projéteis do morteiro
    for (const s of this.shells) {
      s.t -= dt; s.vy += G * dt; s.x += s.vx * dt; s.y += s.vy * dt;
      if (s.y >= GY - 2) {
        s.done = true;
        FX.explosion(s.x, GY - 6, 0.7); Audio.play('explode'); Game.addShake(3, 0.12);
        const r = C.mortar.radius;
        const dx = Math.max(Math.abs(p.x - s.x) - p.w / 2, 0), dy = Math.max((GY - 6) - p.y, 0, (p.y - p.h) - (GY - 6));
        if (!p.dead && dx * dx + dy * dy < r * r) p.hurt(1, s.x);
      }
    }
    this.shells = this.shells.filter(s => !s.done);
    // ondas de choque
    for (const w of this.waves) {
      w.x += w.dir * w.sp * dt;
      if (w.x < A || w.x > E) w.done = true;
      if (Math.random() < 0.6) Pools.particle({ x: w.x, y: GY - 2, vx: Util.rand(-20, 20), vy: Util.rand(-90, -30), life: 0.3, color: '#ffb02e', size: 1.5, kind: 'spark', grav: 300 });
      if (!p.dead && p.y > GY - C.wave.h && Math.abs(p.x - w.x) < C.wave.w / 2 + p.w / 2) p.hurt(1, w.x - w.dir * 10);
    }
    this.waves = this.waves.filter(w => !w.done);
    // contato
    if (!p.dead && this.state !== 'intro' && Util.overlap(this, p)) p.hurt(C.contactDmg, this.x);
  },
  drawSentinela(t) {
    // avisos (desenhados mesmo após a morte dos projéteis)
    const C = CONFIG.boss, GY = CONFIG.world.groundY;
    for (const s of this.shells) {
      const k = 1 - s.t / s.max;
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = `rgba(255,60,60,${0.5 + 0.5 * Math.sin(t * 30)})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(s.tx, GY - 1, C.mortar.radius * (1.3 - k * 0.3), 5, 0, 0, 6.28); ctx.stroke();
      ctx.fillStyle = 'rgba(255,60,60,0.18)'; ctx.beginPath(); ctx.ellipse(s.tx, GY - 1, C.mortar.radius * k, 4 * k, 0, 0, 6.28); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#2b2e3d'; ctx.beginPath(); ctx.arc(s.x, s.y, 5, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#ffb02e'; ctx.beginPath(); ctx.arc(s.x, s.y, 2, 0, 6.28); ctx.fill();
    }
    ctx.globalCompositeOperation = 'lighter';
    for (const w of this.waves) {
      ctx.fillStyle = 'rgba(255,150,40,0.35)';
      ctx.beginPath(); ctx.moveTo(w.x - 14, GY); ctx.quadraticCurveTo(w.x, GY - C.wave.h * 1.8, w.x + 14, GY); ctx.fill();
      ctx.fillStyle = 'rgba(255,230,160,0.8)';
      ctx.beginPath(); ctx.moveTo(w.x - 6, GY); ctx.quadraticCurveTo(w.x, GY - C.wave.h, w.x + 6, GY); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    if (!this.active) return;
    // linha de aviso da rajada
    if (this.state === 'burstTele' && Math.floor(t * 16) % 2 === 0) {
      ctx.strokeStyle = 'rgba(255,42,109,0.75)'; ctx.lineWidth = 1.5; ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.moveTo(Level.arenaX, this.burstY); ctx.lineTo(Level.arenaEnd, this.burstY); ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center'; ctx.fillStyle = '#ff9ab0';
      ctx.fillText(this.burstY === C.burst.highY ? 'AGACHE!' : 'PULE!', this.x - this.facing * 10, this.y - this.h - 22);
    }
    const fl = this.flash > 0 || (this.dying && Math.floor(t * 20) % 2 === 0);
    const co = this.crouchOff();
    const shake = this.dying ? Util.rand(-2, 2) : 0;
    ctx.save();
    ctx.translate(this.x + shake, this.y);
    ctx.scale(this.facing, 1);
    const walk = Math.abs(this.vx) > 2 && this.onGround ? Math.sin(this.anim * 7) : 0;
    const dark = fl ? '#fff' : '#2b2e3d', body = fl ? '#fff' : '#4a4f63', plate = fl ? '#fff' : '#5c6278';
    // pernas (articulação invertida)
    const leg = (hx, ph) => {
      const hy = -38 + co;
      const kx = hx + 10 + ph * 4, ky = -20 + co * 0.5, fx = hx + ph * 6, fy = this.onGround ? -2 : -6;
      ctx.strokeStyle = dark; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
      ctx.fillStyle = plate; ctx.beginPath(); ctx.arc(kx, ky, 4.5, 0, 6.28); ctx.fill();
      ctx.fillStyle = dark; ctx.fillRect(fx - 10, fy - 2, 20, 4);
    };
    leg(-16, -walk); leg(12, walk);
    // casco
    const hy = -78 + co;
    ctx.fillStyle = body; Util.rr(ctx, -33, hy, 66, 42, 8); ctx.fill();
    ctx.fillStyle = plate; Util.rr(ctx, -28, hy + 4, 40, 12, 4); ctx.fill();

/* ============================ Mecha BION-WALKER (estacionado + desenho) ============================ */
const MechUnits = {
  list: [],
  create(x, y, armor, missiles, facing, blocked) {
    const C = CONFIG.mech;
    this.list.push({ x, y, vx: 0, vy: 0, w: C.w, h: C.h, armor: armor ?? C.armor, missiles: missiles ?? C.missiles, facing: facing || 1, onGround: false, t: 0, blocked: !!blocked });
  },
  update(dt) {
    for (const u of this.list) {
      u.t += dt; u.vx = 0;
      Physics.move(u, dt);
      if (u.missiles < CONFIG.mech.missiles) { u.rt = (u.rt || 0) + dt; if (u.rt >= CONFIG.mech.missileRecharge) { u.rt = 0; u.missiles++; } }
    }
    this.list = this.list.filter(u => u.x > Game.camX - 120 && u.y < CONFIG.world.height + 60);
  },
  draw(t) {
    for (const u of this.list) {
      this.drawWalker(u.x, u.y, u.facing, { t, aimA: 0.35, runPhase: 0, onGround: true, moving: false, pilot: false, missiles: u.missiles });
      // indicador de entrada
      const by = u.y - 66 + Math.sin(t * 5) * 2.5;
      ctx.textAlign = 'center'; ctx.font = 'bold 8px monospace';
      ctx.fillStyle = '#000'; ctx.fillText('ENTRAR', u.x + 1, by - 5);
      ctx.fillStyle = '#55ff9a'; ctx.fillText('ENTRAR', u.x, by - 6);
      ctx.beginPath(); ctx.moveTo(u.x - 5, by); ctx.lineTo(u.x + 5, by); ctx.lineTo(u.x, by + 6); ctx.fill();
      // armadura restante
      ctx.fillStyle = '#152430'; ctx.fillRect(u.x - 15, u.y - 58, 30, 3);
      ctx.fillStyle = '#ffb02e'; ctx.fillRect(u.x - 15, u.y - 58, 30 * (u.armor / CONFIG.mech.armor), 3);
    }
  },
  // desenho do walker (origem nos pés)
  drawWalker(x, y, facing, o) {
    const t = o.t, fl = o.flash;
    const white = fl ? '#ffffff' : '#dfe8ee', shade = fl ? '#ffffff' : '#9fb2c2', dark = fl ? '#ffffff' : '#2a3542', mid = fl ? '#fff' : '#566a7c';
    ctx.save();
    ctx.translate(x + (o.dying ? Util.rand(-1.5, 1.5) : 0), y);
    ctx.scale(facing, 1);
    const sq = o.entering > 0 ? Math.sin((1 - o.entering / CONFIG.mech.enterTime) * Math.PI) * 4 : 0;
    // pernas (digitígradas)
    const leg = (hx, ph, col) => {
      const lift = o.moving && o.onGround ? Math.max(0, Math.sin(o.runPhase + ph)) * 5 : (o.onGround ? 0 : 3);
      const sw = o.moving ? Math.cos(o.runPhase + ph) * 7 : 0;
      const hy = -24 + sq;
      const kx = hx + 7 + sw * 0.4, ky = -15 - lift * 0.5 + sq * 0.5;
      const ax = hx - 3 + sw, ay = -5 - lift;
      ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(kx, ky); ctx.lineTo(ax, ay); ctx.stroke();
      ctx.fillStyle = shade; ctx.beginPath(); ctx.arc(kx, ky, 3, 0, 6.28); ctx.fill();
      ctx.fillStyle = dark; Util.rr(ctx, ax - 7, ay + 1, 15, 4, 1.5); ctx.fill();
    };
    leg(-5, Math.PI, mid);
    // casulo de mísseis nas costas
    ctx.fillStyle = dark; Util.rr(ctx, -24, -52 + sq, 10, 18, 2); ctx.fill();
    for (let i = 0; i < 8; i++) {
      const on = i < (o.missiles ?? 0);
      ctx.fillStyle = on ? '#55ff9a' : '#1a242e';
      ctx.fillRect(-22.5 + (i % 2) * 4, -50 + sq + Math.floor(i / 2) * 4, 2.5, 2.5);
    }
    // casco
    ctx.fillStyle = white; Util.rr(ctx, -16, -47 + sq, 32, 24, 6); ctx.fill();
    ctx.fillStyle = shade; ctx.fillRect(-16, -30 + sq, 32, 5);
    ctx.fillStyle = '#55ff9a'; ctx.fillRect(-13, -36 + sq, 14, 2);
    ctx.fillStyle = dark; ctx.font = 'bold 5px monospace'; ctx.textAlign = 'left'; ctx.fillText('BW-01', -13, -39 + sq);
    // cabine de vidro
    ctx.fillStyle = 'rgba(20,40,55,0.9)'; ctx.beginPath(); ctx.arc(4, -47 + sq, 9, Math.PI, 0); ctx.fill();
    if (o.pilot) {
      ctx.fillStyle = '#eef4f8'; Util.rr(ctx, 0, -54 + sq, 9, 7, 2.5); ctx.fill();
      ctx.fillStyle = '#3ff6ff'; ctx.fillRect(4.5, -52 + sq, 4, 1.8);
    }
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = o.pilot ? 'rgba(63,246,255,0.22)' : 'rgba(63,246,255,0.08)';
    ctx.beginPath(); ctx.arc(4, -47 + sq, 9, Math.PI, 0); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = shade; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(4, -47 + sq, 9, Math.PI, 0); ctx.stroke();
    // perna da frente
    leg(6, 0, white);
    // braço com metralhadora dupla
    ctx.save(); ctx.translate(10, -34 + sq); ctx.rotate(o.aimA || 0);
    ctx.fillStyle = shade; Util.rr(ctx, -5, -7, 13, 14, 3); ctx.fill();
    ctx.fillStyle = dark; ctx.fillRect(6, -5, 20, 3.5); ctx.fillRect(6, 1.5, 20, 3.5);
    ctx.fillStyle = '#ffb02e'; ctx.fillRect(23, -5, 3, 3.5); ctx.fillRect(23, 1.5, 3, 3.5);
    if (o.muzzle) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,230,140,0.9)';
      ctx.beginPath(); ctx.moveTo(26, -7); ctx.lineTo(36 + Math.random() * 5, 0); ctx.lineTo(26, 7); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
    // escudo de investida
    if (o.charging) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(85,255,154,0.8)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(10, -26, 24, -1.1, 1.1); ctx.stroke();
      ctx.fillStyle = 'rgba(85,255,154,0.15)'; ctx.beginPath(); ctx.arc(10, -26, 24, -1.1, 1.1); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    if (o.dying) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `rgba(255,60,40,${0.25 + 0.25 * Math.sin(t * 30)})`; Util.rr(ctx, -18, -50, 36, 30, 6); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
  }
};

/* ============================ Mísseis teleguiados do mecha ============================ */
const Missiles = {
  list: [],
  spawn(x, y, dir) { this.list.push({ x, y, ang: dir > 0 ? -1.2 : -Math.PI + 1.2, speed: 160, t: 0, dir, w: 6, h: 6 }); },
  findTarget(m) {
    let best = null, bd = 420;
    const L = Game.camX - 10, R = Game.camX + View.viewW + 10;
    const consider = (o) => { if (o.x < L || o.x > R) return; const d = Math.hypot(o.x - m.x, (o.y - o.h / 2) - m.y); if (d < bd) { bd = d; best = o; } };
    for (const e of Enemies.list) if (!e.dead) consider(e);
    if (Boss.active && !Boss.dying) consider(Boss);
    return best;
  },
  explode(m) {
    const C = CONFIG.mech;
    m.done = true;
    FX.explosion(m.x, m.y, 0.9); Audio.play('explode'); Game.addShake(3, 0.12);
    const r = C.missileRadius;
    const inR = o => { const dx = Math.max(Math.abs(o.x - m.x) - o.w / 2, 0), dy = Math.max(Math.abs((o.y - o.h / 2) - m.y) - o.h / 2, 0); return dx * dx + dy * dy < r * r; };
    for (const e of Enemies.list) if (!e.dead && inR(e)) Enemies.damage(e, C.missileDmg, true);
    for (const pr of Props.list) if (pr.alive && inR(pr)) Props.damage(pr, C.missileDmg);
    if (Boss.active && !Boss.dying && inR(Boss)) Boss.damage(C.missileDmg);
  },
  update(dt) {
    const C = CONFIG.mech;
    for (const m of this.list) {
      m.t += dt;
      m.speed = Math.min(C.missileSpeed, m.speed + 520 * dt);
      if (m.t > 0.15) {
        if (!m.target || m.target.dead || (m.target === Boss && (!Boss.active || Boss.dying))) m.target = this.findTarget(m);
        const want = m.target ? Math.atan2((m.target.y - m.target.h / 2) - m.y, m.target.x - m.x) : (m.dir > 0 ? 0 : Math.PI);
        let d = want - m.ang; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
        m.ang += Util.clamp(d, -C.missileTurn * dt, C.missileTurn * dt);
      }
      m.x += Math.cos(m.ang) * m.speed * dt; m.y += Math.sin(m.ang) * m.speed * dt;
      if (Math.random() < 0.7) Pools.particle({ x: m.x - Math.cos(m.ang) * 6, y: m.y - Math.sin(m.ang) * 6, vx: Util.rand(-15, 15), vy: Util.rand(-15, 15), life: 0.4, color: 'rgba(170,190,200,1)', size: 2.5, kind: 'smoke', add: false, drag: 2 });
      const pt = { x: m.x, y: m.y + 3, w: 6, h: 6 };
      let hit = m.t > C.missileLife || Physics.pointInSolid(m.x, m.y) || m.y > CONFIG.world.height + 20 || m.y < -40;
      if (!hit) for (const e of Enemies.list) if (!e.dead && Util.overlap(pt, e)) { hit = true; break; }
      if (!hit) for (const pr of Props.list) if (pr.alive && Util.overlap(pt, pr)) { hit = true; break; }
      if (!hit && Boss.active && !Boss.dying && Util.overlap(pt, Boss)) hit = true;
      if (hit) this.explode(m);
    }
    this.list = this.list.filter(m => !m.done);
  },
  draw(t) {
    for (const m of this.list) {
      ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.ang);
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,170,60,0.8)'; ctx.beginPath(); ctx.moveTo(-4, -2); ctx.lineTo(-10 - Math.random() * 5, 0); ctx.lineTo(-4, 2); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#dfe8ee'; ctx.fillRect(-5, -2, 9, 4);
      ctx.fillStyle = '#55ff9a'; ctx.beginPath(); ctx.moveTo(4, -2); ctx.lineTo(7, 0); ctx.lineTo(4, 2); ctx.fill();
      ctx.restore();
    }
  }
};

      const col = on ? '85,255,154' : '255,60,90';

    }

        ctx.fillStyle = Render.groundGrad; ctx.fillRect(x0, s.y, x1 - x0, s.h);
        ctx.strokeStyle = T.groundLines; ctx.lineWidth = 1;
        const step = T.grass ? 48 : 14;
        ctx.beginPath();
        if (T.grass) for (let x = Math.floor(x0 / step) * step; x < x1; x += step) { ctx.moveTo(x, s.y + 8); ctx.lineTo(x + 10, s.y + 60); }
        else { for (let x = Math.floor(x0 / step) * step; x < x1; x += step) { ctx.moveTo(x, s.y + 3); ctx.lineTo(x, s.y + 12); } ctx.moveTo(x0, s.y + 12.5); ctx.lineTo(x1, s.y + 12.5); ctx.moveTo(x0, s.y + 30); ctx.lineTo(x1, s.y + 30); }
        ctx.stroke();
        if (T.grass) {
        ctx.strokeStyle = T.grass; ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (let x = Math.floor(x0 / 9) * 9; x < x1; x += 9) {
          const hh = 3 + ((x * 7919) % 7);
          const sway = Math.sin(t * 2 + x * 0.05) * 1.5;
          ctx.moveTo(x, s.y); ctx.lineTo(x + sway, s.y - hh);
        }
        ctx.stroke();
        }
      } else if (s.kind === 'wall') {
        ctx.fillStyle = '#141a2a'; ctx.fillRect(s.x, s.y, s.w, s.h);
        ctx.fillStyle = '#ffb02e';
        for (let y = s.y; y < s.y + s.h; y += 24) { ctx.beginPath(); ctx.moveTo(s.x, y); ctx.lineTo(s.x + 10, y); ctx.lineTo(s.x, y + 12); ctx.fill(); }

        continue;
      } else if (s.kind === 'ceiling') {
        ctx.fillStyle = '#1a0a12'; ctx.fillRect(s.x, s.y, s.w, s.h);
        ctx.fillStyle = '#2a1020';
        for (let x = s.x + 6; x < s.x + s.w - 6; x += 22) { ctx.beginPath(); ctx.moveTo(x, s.y + s.h); ctx.lineTo(x + 6, s.y + s.h + 7); ctx.lineTo(x + 12, s.y + s.h); ctx.fill(); }

        ctx.fillStyle = 'rgba(255,200,80,0.8)';
        for (let x = s.x + 20; x < s.x + s.w; x += 60) ctx.fillRect(x, s.y + s.h - 4, 8, 2);
        ctx.globalCompositeOperation = 'source-over';
        continue;
      } else if (s.kind === 'gate') {
        ctx.globalCompositeOperation = 'lighter';
        const a = 0.35 + 0.2 * Math.sin(t * 12);
        ctx.fillStyle = `rgba(255,42,109,${a})`; ctx.fillRect(s.x + 8, s.y, 8, s.h);
        ctx.fillStyle = 'rgba(255,200,220,0.8)'; ctx.fillRect(s.x + 11, s.y, 2, s.h);

        continue;
      } else {
        ctx.fillStyle = T.block[0]; ctx.fillRect(s.x, s.y, s.w, s.h);
        ctx.fillStyle = T.block[1]; ctx.fillRect(s.x, s.y, s.w, 6);
        ctx.fillStyle = T.block[2];
        for (let x = s.x + 8; x < s.x + s.w - 4; x += 22) ctx.fillRect(x, s.y + 12, 3, 3);
        if (!T.grass) { ctx.strokeStyle = T.block[3]; ctx.beginPath(); for (let y = s.y + 22; y < s.y + s.h - 4; y += 18) { ctx.moveTo(s.x + 4, y); ctx.lineTo(s.x + s.w - 4, y + 12); } ctx.stroke(); }
        ctx.strokeStyle = T.block[3]; ctx.strokeRect(s.x + 0.5, s.y + 0.5, s.w - 1, s.h - 1);
      }
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = T.edgeGlow; ctx.fillRect(x0, s.y - 2, x1 - x0, 5);
      ctx.fillStyle = T.edge; ctx.fillRect(x0, s.y, x1 - x0, 1.5);
      ctx.globalCompositeOperation = 'source-over';
    }
    // plataformas suspensas
    for (const p of this.oneways) {
      if (p.x + p.w < L || p.x > R) continue;
      if (p.mover) {
        ctx.fillStyle = '#2a2230'; Util.rr(ctx, p.x, p.y, p.w, 10, 3); ctx.fill();
        ctx.fillStyle = '#ffb02e';
        for (let x = p.x + 4; x < p.x + p.w - 6; x += 12) { ctx.beginPath(); ctx.moveTo(x, p.y + 10); ctx.lineTo(x + 5, p.y + 3); ctx.lineTo(x + 9, p.y + 3); ctx.lineTo(x + 4, p.y + 10); ctx.fill(); }
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = 'rgba(255,170,60,0.9)'; ctx.fillRect(p.x + 2, p.y, p.w - 4, 1.5);
        for (const tx of [p.x + 14, p.x + p.w - 14]) { const fh = 6 + Math.random() * 5; ctx.fillStyle = 'rgba(255,120,200,0.7)'; ctx.beginPath(); ctx.moveTo(tx - 4, p.y + 10); ctx.lineTo(tx, p.y + 10 + fh); ctx.lineTo(tx + 4, p.y + 10); ctx.fill(); }
        ctx.globalCompositeOperation = 'source-over';
        continue;
      }
      ctx.fillStyle = T.plat[0]; Util.rr(ctx, p.x, p.y, p.w, 9, 3); ctx.fill();
      ctx.fillStyle = T.plat[1]; ctx.fillRect(p.x + 3, p.y + 1, p.w - 6, 3);
      ctx.lineWidth = 1;
      ctx.beginPath();
      if (T.vines) {
        ctx.strokeStyle = 'rgba(125,255,106,0.5)';
        for (let x = p.x + 10; x < p.x + p.w - 6; x += 26) {
          const len = 10 + ((x * 31) % 18);
          ctx.moveTo(x, p.y + 9);
          ctx.quadraticCurveTo(x + Math.sin(t * 1.5 + x) * 4, p.y + 9 + len / 2, x, p.y + 9 + len);
        }
      } else {
        // treliça da ponte metálica
        ctx.strokeStyle = 'rgba(70,90,130,0.8)';
        ctx.moveTo(p.x + 4, p.y + 18); ctx.lineTo(p.x + p.w - 4, p.y + 18);
        for (let x = p.x + 4; x < p.x + p.w - 14; x += 14) { ctx.moveTo(x, p.y + 9); ctx.lineTo(x + 14, p.y + 18); ctx.moveTo(x + 14, p.y + 9); ctx.lineTo(x, p.y + 18); }
      }
      ctx.stroke();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = T.plat[2]; ctx.fillRect(p.x + 2, p.y + 8, p.w - 4, 4);
      ctx.fillStyle = T.plat[3]; ctx.fillRect(p.x + 2, p.y, p.w - 4, 1.2);
      ctx.globalCompositeOperation = 'source-over';
    }
    if (this.lasers.length) this.drawLasers(L, R, t);
  }

/* ============================ Game ============================ */
const Game = {
  state: 'menu', paused: false, time: 0, camX: 0, score: 0, hitStop: 0,
  shakeAmp: 0, shakeT: 0, shakeDur: 0, spawnIdx: 0, deadT: 0, popups: [],
  boss: null, combo: 0, comboT: 0, lives: CONFIG.extraLives, banner: null,
  stats: { kills: 0, allies: 0, maxCombo: 0, time: 0 },
  diffKey: CONFIG.defaultDifficulty, diff: CONFIG.difficulty[CONFIG.defaultDifficulty],
  levelTime: 0, phase: 1, pendingPhase: 1, cpIdx: 0, arena: false, bossDone: false, introT: 0, clearT: 0,
  menuSel: 0, newRecord: false, phaseStats: null,
  inMenu() { return this.state === 'menu' || this.state === 'diff' || this.state === 'howto'; },
  isOverlayMenu() { return this.inMenu() || this.state === 'result' || this.state === 'next' || this.state === 'gameover' || this.state === 'victory' || this.paused; },
  isPlaying() { return this.state === 'play' || this.state === 'dead' || this.state === 'clear'; },
  goto(state) { this.state = state; this.menuSel = 0; Input.clear(); },
  toMenu() { this.paused = false; Boss.reset(); this.clearWorld(); Level.build(1); this.goto('menu'); },
  // passa para a próxima fase mantendo pontos, vidas, arma e bombas
  nextPhase() {
    const keep = { weapon: Player.weapon, ammo: Player.ammo, bombs: Player.bombs };
    this.startPhase(this.phase + 1);
    Object.assign(Player, keep);
  },
  // nova partida a partir de uma fase (pontuação zera)
  startRun(phase) {
    this.diff = CONFIG.difficulty[this.diffKey];
    this.score = 0; this.lives = CONFIG.extraLives; this.newRecord = false;
    this.stats = { kills: 0, allies: 0, maxCombo: 0, time: 0 };
    this.startPhase(phase);
  },
  clearWorld() {
    Enemies.list = []; Props.list = []; Allies.list = []; Items.list = []; Bombs.list = []; MechUnits.list = []; Missiles.list = [];
    Pools.clearBullets();
    for (const p of Pools.particles) p.on = false;
    Boss.reset();
    this.combo = 0; this.comboT = 0; this.banner = null; this.popups = []; this.hitStop = 0; this.shakeT = 0;
  },
  startPhase(phase) {
    this.phase = phase;
    Level.build(phase);
    this.clearWorld();
    this.cpIdx = 0; this.arena = false; this.bossDone = false;
    this.camX = 0; this.spawnIdx = 0; this.levelTime = 0;
    this.phaseStart = { kills: this.stats.kills, allies: this.stats.allies, time: this.stats.time }; this.phaseMaxCombo = 0;
    Player.reset(Level.checkpoints[0].x, CONFIG.world.groundY);
    this.paused = false;
    this.goto('intro'); this.introT = 2.6;
    Audio.play('start');
  },
  respawnAtCheckpoint() {
    const cp = Level.checkpoints[this.cpIdx];
    Enemies.list = []; Props.list = []; Allies.list = []; Items.list = []; Bombs.list = []; MechUnits.list = []; Missiles.list = [];
    Pools.clearBullets(); Boss.reset(); Level.openGate();
    this.arena = false; this.combo = 0; this.comboT = 0;
    this.camX = Math.max(0, cp.x - View.viewW * CONFIG.camera.lead);
    this.spawnIdx = Level.spawns.findIndex(s => s.x >= this.camX - 20);
    if (this.spawnIdx < 0) this.spawnIdx = Level.spawns.length;
    Player.reset(cp.x, CONFIG.world.groundY);
    Player.invuln = CONFIG.player.respawnInvuln;
    this.state = 'play';
    this.showBanner('VIDAS x' + this.lives, 'De volta ao checkpoint', '#3ff6ff');
  },
  enterArena() {
    this.arena = true;
    for (const e of Enemies.list) if (!e.dead) FX.explosion(e.x, e.y - e.h / 2, 0.6);
    Enemies.list = []; Pools.clearBullets('e');
    Level.closeGate();
    Boss.spawn(Level.bossKind === 'vortex' ? (Level.arenaX + Level.arenaEnd) / 2 : (Level.bossKind === 'overlord' ? Level.arenaEnd - 75 : Level.arenaEnd - 110), Level.bossKind);
    this.showBanner('ALERTA!', Boss.name + ' DETECTADA', '#ff2a6d');
    Audio.play('warn');
  },
  bossDefeated(x, y) {
    this.bossDone = true;
    this.addScore(Boss.score, x, y);
    this.showBanner(Boss.kind === 'overlord' ? 'NÚCLEO DESTRUÍDO!' : 'SETOR LIMPO!', Boss.name + (Boss.kind === 'sentinela' ? ' DESTRUÍDA' : ' DESTRUÍDO'), '#55ff9a');
    Player.invuln = 99;
    Audio.play('victory');
    this.state = 'clear'; this.clearT = 3.0;
  },
  saveRecord() {
    try {
      const r = Save.data.recordes;
      if (this.score > (r[this.diffKey] || 0)) { r[this.diffKey] = this.score; this.newRecord = true; }
      Save.write();
    } catch (e) {}
  },
  finishPhase() {
    const ps = this.phaseStart || { kills: 0, allies: 0, time: 0 };
    this.phaseStats = { score: this.score, kills: this.stats.kills - ps.kills, allies: this.stats.allies - ps.allies, maxCombo: this.phaseMaxCombo || 0, time: this.stats.time - ps.time };
    Save.data.progresso.faseDesbloqueada = Math.min(3, Math.max(Save.data.progresso.faseDesbloqueada, this.phase + 1));
    this.newRecord = false;
    this.saveRecord();
    this.goto('result');
  },
  gameOver() {
    this.newRecord = false;
    this.saveRecord();
    Audio.play('gameover');
    this.goto('gameover');
  },
  addShake(amp, dur) {
    amp = Math.min(amp, CONFIG.fx.shakeMax);
    if (amp >= this.shakeAmp * (this.shakeT / (this.shakeDur || 1))) { this.shakeAmp = amp; this.shakeT = dur; this.shakeDur = dur; }
  },
  comboMult() {
    for (const [n, m] of CONFIG.combo.tiers) if (this.combo >= n) return m;
    return 1;
  },
  registerKill(x, y, base) {
    this.combo = this.comboT > 0 ? this.combo + 1 : 1;
    this.comboT = CONFIG.combo.window;
    this.stats.kills++;
    this.stats.maxCombo = Math.max(this.stats.maxCombo, this.combo);
    this.phaseMaxCombo = Math.max(this.phaseMaxCombo || 0, this.combo);
    const m = this.comboMult();
    const pts = base * this.diff.scoreMul * m;
    this.score += pts;
    this.popup(x, y, '+' + pts + (m > 1 ? ' x' + m : ''), m > 1 ? '#ffb02e' : '#ffe27a');
    if (this.combo > 1) this.popup(x, y - 11, this.combo + ' COMBO', '#3ff6ff');
  },
  addScore(base, x, y) {
    const pts = base * this.diff.scoreMul;
    this.score += pts;
    if (x !== undefined) this.popup(x, y, '+' + pts, '#ffe27a');
  },
  breakCombo() { this.combo = 0; this.comboT = 0; },
  showBanner(text, sub, color) { this.banner = { text, sub, color, t: 1.6, max: 1.6 }; },
  popup(x, y, text, color) {
    if (this.popups.length > 20) this.popups.shift();
    this.popups.push({ x, y, text, color, t: 0.9 });
  },
  playerDied() {
    if (Player.dead) return;
    Player.dead = true;
    FX.explosion(Player.x, Player.y - 16, 1.4);
    this.addShake(8, 0.35);
    this.breakCombo();
    Audio.play('death');
    this.state = 'dead'; this.deadT = 1.8;
  },
  setPaused(v) {
    if (!this.isPlaying()) return;
    if (this.paused === v) return;
    this.paused = v; this.menuSel = 0;
    Input.clear();
    if (!v) Audio.init();
  },
  toggleMute() {
    Save.data.config.mudo = !Save.data.config.mudo;
    Audio.setMuted(Save.data.config.mudo);
    Save.write();
  },
  updateCamera(dt) {
    if (this.arena) {
      const A = Level.arenaX, E = Level.arenaEnd, aw = E - A;
      const target = View.viewW >= aw ? A + aw / 2 - View.viewW / 2 : Util.clamp(Player.x - View.viewW / 2, A, E - View.viewW);
      this.camX = Util.lerp(this.camX, target, Math.min(1, dt * 4));
      return;
    }
    const target = Player.x - View.viewW * CONFIG.camera.lead;
    const maxCam = Math.max(0, Level.length - View.viewW);
    if (target > this.camX) this.camX = Math.min(maxCam, Util.lerp(this.camX, target, Math.min(1, dt * 8)));
    this.camX = Util.clamp(this.camX, 0, maxCam);
  },
  update(dt) {
    this.time += dt;
    Input.update();
    if (this.state === 'intro') { this.introT -= dt; if (this.introT <= 0) this.goto('play'); return; }
    if (this.state === 'victory') { FX.update(dt); return; }
    if (!this.isPlaying() || this.paused) return;
    if (this.shakeT > 0) this.shakeT -= dt;
    if (this.hitStop > 0) { this.hitStop -= dt; return; }
    if (this.state !== 'clear') this.stats.time += dt;

    if (this.state === 'dead') {
      this.deadT -= dt;
      if (this.deadT <= 0) {
        if (this.lives > 0) { this.lives--; this.respawnAtCheckpoint(); }
        else { this.gameOver(); return; }
      }
    }
    if (this.state === 'clear') {
      this.clearT -= dt;
      if (this.clearT <= 0) { this.finishPhase(); return; }
    }
    this.levelTime += dt;
    if (Level.movers.length) {
      Level.updateMovers();
      // plataformas móveis carregam quem está em cima
      for (const b of [Player, ...MechUnits.list]) {
        const g = b.groundRef;
        if (b.onGround && g && g.mover && !b.dead) { b.x += g.dx; b.y = g.y; }
      }
    }
    Player.update(dt);
    Level.updateLasers();
    this.updateCamera(dt);

    // checkpoints
    for (let i = this.cpIdx + 1; i < Level.checkpoints.length; i++) {
      if (!Player.dead && Player.x >= Level.checkpoints[i].x) {
        this.cpIdx = i; this.showBanner('CHECKPOINT', 'Progresso salvo nesta fase', '#55ff9a'); Audio.play('checkpoint');
      }
    }
    // arena do chefe
    if (!this.arena && !this.bossDone && !Player.dead && Player.x > Level.arenaX + 40) this.enterArena();

    // spawn por posição da câmera
    while (this.spawnIdx < Level.spawns.length && Level.spawns[this.spawnIdx].x < this.camX + View.viewW + 30) {
      const s = Level.spawns[this.spawnIdx++];
      if (this.arena || s.x > Level.arenaX) continue;
      if (s.type === 'mech') MechUnits.create(s.x, s.y - 40);
      else if (CONFIG.enemies[s.type]) Enemies.create(s.type, s.x, s.y);
      else if (!s.done) Props.create(s.type, s.x, s.y, s.item, s);
    }
    if (this.comboT > 0) { this.comboT -= dt; if (this.comboT <= 0) this.combo = 0; }
    if (this.banner) { this.banner.t -= dt; if (this.banner.t <= 0) this.banner = null; }
    Enemies.update(dt);
    Boss.update(dt);
    Bombs.update(dt);
    Missiles.update(dt);
    MechUnits.update(dt);
    Bullets.update(dt);
    Props.update(dt);
    Allies.update(dt);
    Items.update(dt);
    FX.update(dt);
    for (const p of this.popups) { p.t -= dt; p.y -= 30 * dt; }
    this.popups = this.popups.filter(p => p.t > 0);
  },
  draw() {
    const t = this.time;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#03040a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    const k = View.scale * View.dpr;
    ctx.setTransform(k, 0, 0, k, View.gx * View.dpr, View.gy * View.dpr);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, View.viewW, CONFIG.world.height); ctx.clip();

    const menu = this.inMenu();
    const camX = menu ? (t * 30) % 3000 : this.camX;
    Render.drawSky(t);
    Render.drawLayer(Render.bgFar, 0.15, camX);
    Render.drawFlies(camX * 0.6, t);
    Render.drawLayer(Render.bgMid, 0.4, camX);

    let sx = 0, sy = 0;
    if (this.shakeT > 0) { const a = this.shakeAmp * (this.shakeT / this.shakeDur); sx = Util.rand(-a, a); sy = Util.rand(-a, a); }
    ctx.save();
    ctx.translate(-Math.round(camX * 100) / 100 + sx, sy);
    Level.draw(camX, t);
    if (!menu) {
      Props.draw(t);
      Items.draw(t);
      Enemies.draw(t);
      Boss.draw(t);
      MechUnits.draw(t);
      Allies.draw(t);
      Player.draw(t);
      Bombs.draw(t);
      Missiles.draw(t);
      Bullets.draw();
      FX.draw();
      ctx.textAlign = 'center'; ctx.font = 'bold 10px monospace';
      for (const p of this.popups) { ctx.globalAlpha = Math.min(1, p.t * 2); ctx.fillStyle = '#000'; ctx.fillText(p.text, p.x + 1, p.y + 1); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y); }
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(0, 0, View.viewW, 6); ctx.fillRect(0, 354, View.viewW, 6);

    if (this.isPlaying()) { UI.drawHUD(t); if (!this.paused) UI.drawBanner(t); }
    UI.drawOverlay(t);
    ctx.restore();

    ctx.setTransform(View.dpr, 0, 0, View.dpr, 0, 0);
    UI.drawControls(t);
  }
};

/* ============================ UI ============================ */
const UI = {
  stickHome: { x: 0, y: 0, r: 56 },
  buttons: [], top: [],
  layout() {
    const W = View.W, H = View.H, s = View.safe, C = CONFIG.input;
    const size = Util.clamp(Math.min(W, H) * 0.17, C.btnMin, C.btnMax);
    const r = size / 2;
    let cy, stickX, ax, ay;
    if (!View.portrait) {
      cy = H - s.b - size * 1.05;
      stickX = s.l + size * 1.25 + 8;
      ax = W - s.r - size * 0.72 - 6; ay = H - s.b - size * 0.72 - 6;
    } else {
      const top = View.gy + View.gh, bottom = H - s.b;
      cy = top + (bottom - top) * 0.55;
      stickX = W * 0.25;
      ax = W - s.r - size * 0.72 - 10; ay = cy + size * 0.6;
    }
    this.stickHome = { x: stickX, y: cy, r: size * 0.95 };
    this.buttons = [
      { name: 'jump', label: 'PULO', x: ax, y: ay, r, color: '#55ff9a' },
      { name: 'fire', label: 'TIRO', x: ax - size * 1.22, y: ay + size * 0.12, r, color: '#ff4d6d' },
      { name: 'dash', label: 'DASH', x: ax - size * 0.1, y: ay - size * 1.2, r, color: '#3ff6ff' },
      { name: 'bomb', label: 'BOMBA', x: ax - size * 1.32, y: ay - size * 1.08, r, color: '#ffb02e' }
    ];
    const tb = C.topBtn, ty = (View.portrait ? View.gy + View.gh + 4 : Math.max(s.t, View.gy)) + 6;
    const rightEdge = View.portrait ? W - s.r - 6 : Math.min(W - s.r, View.gx + View.gw) - 6;
    this.top = [
      { name: 'pause', x: rightEdge - tb, y: ty, w: tb, h: tb },
      { name: 'mute', x: rightEdge - tb * 2 - 8, y: ty, w: tb, h: tb },
      { name: 'full', x: rightEdge - tb * 3 - 16, y: ty, w: tb, h: tb }
    ];
  },
  hitTop(x, y) {
    for (const b of this.top) if (x >= b.x - 4 && x <= b.x + b.w + 4 && y >= b.y - 4 && y <= b.y + b.h + 4) return b.name;
    return null;
  },
  hitButton(x, y) {
    let best = null, bd = Infinity;
    for (const b of this.buttons) {
      const d = Math.hypot(x - b.x, y - b.y);
      if (d < b.r * 1.35 && d < bd) { bd = d; best = b.name; }
    }
    return best;
  },
  inStickZone(x, y) {
    if (View.portrait) return y > View.gy + View.gh && x < View.W * 0.5;
    return x < View.W * 0.45 && y > View.H * 0.28;
  },
  inButtonZone(x, y) {
    if (View.portrait) return y > View.gy + View.gh && x >= View.W * 0.5;
    return x >= View.W * 0.5 && y > View.H * 0.22;
  },
  topAction(name) {
    Audio.init(); Audio.play('ui');
    if (name === 'pause') { if (Game.isPlaying()) Game.setPaused(!Game.paused); }
    else if (name === 'mute') Game.toggleMute();
    else if (name === 'full') this.toggleFullscreen();
  },
  toggleFullscreen() {
    try {
      const d = document, el = d.documentElement;
      if (d.fullscreenElement || d.webkitFullscreenElement) {
        (d.exitFullscreen || d.webkitExitFullscreen).call(d);
      } else {
        const req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (req) {
          const pr = req.call(el, { navigationUI: 'hide' });
          const lock = () => { try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} };
          if (pr && pr.then) pr.then(lock).catch(() => {}); else lock();
        }
      }
    } catch (e) { /* sem tela cheia */ }
  },
  // ---------- HUD (coordenadas do mundo, 360 de altura)
  drawHUD(t) {
    const p = Player;
    const left = Math.max(8, (View.safe.l - View.gx) / View.scale + 8);
    const top = 8;
    const hasMech = !!p.mech;
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(4,10,20,0.55)'; Util.rr(ctx, left - 4, top - 4, 172, hasMech ? 60 : 49, 5); ctx.fill();
    // linha 1: vida + vidas extras
    ctx.font = 'bold 9px monospace'; ctx.fillStyle = '#bfffe0'; ctx.fillText('KAI-4', left, top + 8);
    const segW = Math.min(12, 92 / p.maxHp - 2);
    for (let i = 0; i < p.maxHp; i++) {
      const x = left + 32 + i * (segW + 2);
      ctx.fillStyle = '#152430'; ctx.fillRect(x, top + 1, segW, 8);
      if (i < p.hp) {
        const low = p.hp <= 1 && Math.floor(t * 6) % 2 === 0;
        ctx.fillStyle = low ? '#ff4d6d' : (p.hp <= 2 ? '#ffb02e' : '#55ff9a'); ctx.fillRect(x, top + 1, segW, 8);
        ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x, top + 1, segW, 2);
      }
    }
    // ícone de vidas extras
    const lx = left + 134;
    ctx.fillStyle = '#eef4f8'; Util.rr(ctx, lx, top + 1, 8, 7, 2); ctx.fill();
    ctx.fillStyle = '#3ff6ff'; ctx.fillRect(lx + 4, top + 3, 3.5, 1.8);
    ctx.font = 'bold 9px monospace'; ctx.fillStyle = '#e9fff3'; ctx.fillText('x' + Game.lives, lx + 10, top + 8);
    if (hasMech) {
      const m = p.mech, MC = CONFIG.mech;
      ctx.font = 'bold 8px monospace'; ctx.fillStyle = '#ffd27a';
      ctx.fillText('METRALHADORA DUPLA', left, top + 21); ctx.fillText('∞', left + 110, top + 21);
      ctx.fillStyle = '#55ff9a'; ctx.fillText('MÍSSEIS', left, top + 34);
      for (let i = 0; i < MC.missiles; i++) { ctx.fillStyle = i < m.missiles ? '#55ff9a' : '#1a2a2a'; ctx.fillRect(left + 40 + i * 7, top + 28, 5, 6); }
      if (m.missiles < MC.missiles) { ctx.fillStyle = 'rgba(85,255,154,0.5)'; ctx.fillRect(left + 40 + m.missiles * 7, top + 34, 5 * (m.rechargeT / MC.missileRecharge), 1.5); }
      const ready = p.dashCd <= 0;
      ctx.fillStyle = ready ? '#3ff6ff' : '#5b7480'; ctx.fillText(ready ? 'INVESTIDA OK' : 'INVESTIDA', left + 100, top + 34);
      const low = m.armor <= 8 && Math.floor(t * 6) % 2 === 0;
      ctx.fillStyle = low ? '#ff4d6d' : '#ffb02e'; ctx.fillText('BLINDAGEM', left, top + 46);
      ctx.fillStyle = '#152430'; ctx.fillRect(left + 50, top + 40, 90, 6);
      ctx.fillStyle = low ? '#ff4d6d' : '#ffb02e'; ctx.fillRect(left + 50, top + 40, 90 * (m.armor / m.maxArmor), 6);
      ctx.fillStyle = '#ffffff'; ctx.fillText(String(Math.ceil(m.armor)), left + 144, top + 46);
    } else {
    // linha 2: arma e munição
    const W = CONFIG.weapons[p.weapon];
    const wc = p.weapon === 'pulse' ? '#9fe9ff' : W.color;
    ctx.font = 'bold 8px monospace'; ctx.fillStyle = wc;
    ctx.fillText(W.name, left, top + 21);
    if (W.ammo === Infinity) { ctx.fillStyle = '#9fe9ff'; ctx.fillText('∞', left + 92, top + 21); }
    else {
      ctx.fillStyle = '#152430'; ctx.fillRect(left + 50, top + 15, 40, 6);
      ctx.fillStyle = wc; ctx.fillRect(left + 50, top + 15, 40 * (p.ammo / W.ammo), 6);
      ctx.fillStyle = '#ffffff'; ctx.fillText(String(Math.ceil(p.ammo)), left + 94, top + 21);
    }
    // linha 3: bombas + dash
    ctx.fillStyle = '#26303a'; ctx.beginPath(); ctx.arc(left + 4, top + 31, 4, 0, 6.28); ctx.fill();
    ctx.strokeStyle = '#ffb02e'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#ff5050'; ctx.fillRect(left + 5, top + 28, 1.6, 1.6);
    ctx.fillStyle = p.bombs > 0 ? '#ffd27a' : '#7a6a50'; ctx.font = 'bold 8px monospace';
    ctx.fillText('x' + p.bombs, left + 11, top + 34);
    const ready = p.dashCd <= 0;
    ctx.fillStyle = ready ? '#3ff6ff' : '#5b7480'; ctx.fillText('DASH', left + 40, top + 34);
    ctx.fillStyle = '#152430'; ctx.fillRect(left + 66, top + 28, 56, 6);
    const k = 1 - p.dashCd / CONFIG.player.dashCooldown;
    ctx.fillStyle = ready ? '#3ff6ff' : '#2a7f8f'; ctx.fillRect(left + 66, top + 28, 56 * k, 6);
    if (ready) { ctx.fillStyle = '#bffcff'; ctx.fillText('OK', left + 126, top + 34); }
    }
    // pontos (centro)
    const cx = View.viewW / 2;
    ctx.textAlign = 'center'; ctx.font = 'bold 12px monospace';
    ctx.fillStyle = '#ffe27a';
    ctx.fillText(String(Game.score).padStart(7, '0'), cx, top + 12);
    ctx.font = '7px monospace'; ctx.fillStyle = '#c9b46a'; ctx.fillText('PONTOS', cx, top + 21);
    // combo
    if (Game.combo > 1 && Game.comboT > 0) {
      const m = Game.comboMult();
      const pop = 1 + Math.max(0, Game.comboT - (CONFIG.combo.window - 0.15)) * 3;
      ctx.save(); ctx.translate(cx, top + 37); ctx.scale(pop, pop);
      ctx.font = 'bold 11px monospace';
      ctx.fillStyle = '#000'; ctx.fillText(Game.combo + ' COMBO' + (m > 1 ? '  x' + m : ''), 1, 1);
      ctx.fillStyle = m >= 4 ? '#ff4dd2' : (m >= 2 ? '#ffb02e' : '#3ff6ff');

  drawControls(t) {

      ctx.fillStyle = 'rgba(63,246,255,0.5)'; ctx.fillRect(0, top, W, 1);
      ctx.font = '12px monospace'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(160,220,255,0.55)';

        ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(-3, -6); ctx.lineTo(-3, 6); ctx.fill(); ctx.restore();
      }
      const kx = st.id !== null ? st.kx : bx, ky = st.id !== null ? st.ky : by;
      ctx.fillStyle = st.dir ? 'rgba(63,246,255,0.55)' : 'rgba(150,200,220,0.35)';

      ctx.strokeStyle = 'rgba(220,255,255,0.7)'; ctx.lineWidth = 1.5; ctx.stroke();

          ctx.globalCompositeOperation = 'source-over';
        }

        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.28); ctx.fill();
        ctx.strokeStyle = b.color; ctx.lineWidth = on ? 3 : 2; ctx.stroke();
        this.drawIcon(b.name, b.x, b.y - b.r * 0.12, b.r * 0.42, b.color);
        ctx.font = `bold ${Math.round(b.r * 0.26)}px monospace`; ctx.textAlign = 'center';
        const lbl = Player.mech && b.name === 'bomb' ? 'MÍSSIL' : (Player.mech && b.name === 'dash' ? 'INVESTIDA' : b.label);

      ctx.moveTo(0, -s); ctx.lineTo(0, -s * 0.35); ctx.moveTo(0, s); ctx.lineTo(0, s * 0.35); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, s * 0.14, 0, 6.28); ctx.fill();
    } else if (name === 'jump') {
      ctx.beginPath(); ctx.moveTo(-s * 0.8, s * 0.1); ctx.lineTo(0, -s * 0.7); ctx.lineTo(s * 0.8, s * 0.1);
      ctx.moveTo(-s * 0.8, s * 0.75); ctx.lineTo(0, -s * 0.05); ctx.lineTo(s * 0.8, s * 0.75); ctx.stroke();
    } else if (name === 'bomb') {
      ctx.beginPath(); ctx.arc(-s * 0.1, s * 0.2, s * 0.62, 0, 6.28); ctx.fill();
      ctx.beginPath(); ctx.moveTo(s * 0.3, -s * 0.3); ctx.quadraticCurveTo(s * 0.6, -s * 0.8, s * 0.9, -s * 0.7); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s * 0.9, -s * 0.72, s * 0.15, 0, 6.28); ctx.fill();
    } else if (name === 'dash') {
      ctx.beginPath(); ctx.moveTo(-s * 0.5, -s * 0.7); ctx.lineTo(s * 0.15, 0); ctx.lineTo(-s * 0.5, s * 0.7);
      ctx.moveTo(s * 0.1, -s * 0.7); ctx.lineTo(s * 0.8, 0); ctx.lineTo(s * 0.1, s * 0.7); ctx.stroke();
      ctx.globalAlpha *= 0.6; ctx.beginPath(); ctx.moveTo(-s * 1.1, -s * 0.3); ctx.lineTo(-s * 0.7, -s * 0.3); ctx.moveTo(-s * 1.1, s * 0.3); ctx.lineTo(-s * 0.7, s * 0.3); ctx.stroke();
    }
    ctx.restore();
  },
  drawTopIcon(b) {
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2, s = b.w * 0.26;
    ctx.save(); ctx.translate(cx, cy);
    ctx.strokeStyle = '#bffcff'; ctx.fillStyle = '#bffcff'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (b.name === 'pause') {
      if (Game.paused) { ctx.beginPath(); ctx.moveTo(-s * 0.6, -s); ctx.lineTo(s, 0); ctx.lineTo(-s * 0.6, s); ctx.closePath(); ctx.fill(); }
      else { ctx.fillRect(-s * 0.75, -s, s * 0.5, s * 2); ctx.fillRect(s * 0.25, -s, s * 0.5, s * 2); }
    } else if (b.name === 'mute') {
      ctx.beginPath(); ctx.moveTo(-s, -s * 0.4); ctx.lineTo(-s * 0.4, -s * 0.4); ctx.lineTo(s * 0.2, -s); ctx.lineTo(s * 0.2, s); ctx.lineTo(-s * 0.4, s * 0.4); ctx.lineTo(-s, s * 0.4); ctx.closePath(); ctx.fill();
      if (Save.data.config.mudo) { ctx.strokeStyle = '#ff4d6d'; ctx.beginPath(); ctx.moveTo(s * 0.5, -s * 0.5); ctx.lineTo(s * 1.1, s * 0.5); ctx.moveTo(s * 1.1, -s * 0.5); ctx.lineTo(s * 0.5, s * 0.5); ctx.stroke(); }
      else { ctx.beginPath(); ctx.arc(s * 0.2, 0, s * 0.6, -0.8, 0.8); ctx.stroke(); ctx.beginPath(); ctx.arc(s * 0.2, 0, s * 1.0, -0.8, 0.8); ctx.stroke(); }
    } else if (b.name === 'full') {
      const fs = document.fullscreenElement || document.webkitFullscreenElement;
      const d = fs ? -1 : 1, q = s * 0.45;
      for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
        const px = sx * s, py = sy * s;
        ctx.beginPath(); ctx.moveTo(px - sx * q * d, py); ctx.lineTo(px, py); ctx.lineTo(px, py - sy * q * d); ctx.stroke();
      }
    }
    ctx.restore();
  }
};

/* ============================ Eventos ============================ */
function onPointerDown(e) {
  e.preventDefault();
  Audio.init();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  const x = e.clientX, y = e.clientY;
  const top = UI.hitTop(x, y);
  if (top) { Input.uiPointers.set(e.pointerId, top); return; }
  if (Game.isOverlayMenu() || Game.state === 'intro') { UI.menuTap(x, y); return; }
  if (!Game.isPlaying()) return;
  if (UI.inStickZone(x, y) && Input.stick.id === null) {
    const st = Input.stick, home = UI.stickHome;
    st.id = e.pointerId;
    // direcional flutuante: a base nasce onde o dedo toca (perto da posição padrão)
    const dx = x - home.x, dy = y - home.y, d = Math.hypot(dx, dy), lim = home.r * 1.2;
    if (d > lim) { st.bx = home.x + dx / d * lim; st.by = home.y + dy / d * lim; } else { st.bx = x; st.by = y; }
    if (View.portrait) st.by = Math.max(st.by, View.gy + View.gh + home.r * 0.6);
    st.kx = x; st.ky = y;
    updateStick(x, y);
    return;
  }
  if (UI.inButtonZone(x, y)) {
    const bn = UI.hitButton(x, y);
    Input.btnPointers.set(e.pointerId, bn);
    if (bn) Input.latch.add(bn);
  }
}
function updateStick(x, y) {
  const st = Input.stick, R = UI.stickHome.r;
  let dx = x - st.bx, dy = y - st.by;
  const d = Math.hypot(dx, dy);
  if (d > R) { dx = dx / d * R; dy = dy / d * R; }
  st.kx = st.bx + dx; st.ky = st.by + dy;
  st.dir = Input.stickDirs(dx / R, dy / R);
}
function onPointerMove(e) {
  if (Input.stick.id === e.pointerId) { e.preventDefault(); updateStick(e.clientX, e.clientY); return; }
  if (Input.btnPointers.has(e.pointerId)) {
    e.preventDefault();
    Input.btnPointers.set(e.pointerId, UI.hitButton(e.clientX, e.clientY)); // deslizar entre botões
  }
}
function onPointerUp(e) {
  const ui = Input.uiPointers.get(e.pointerId);
  if (ui) {
    Input.uiPointers.delete(e.pointerId);
    if (UI.hitTop(e.clientX, e.clientY) === ui) UI.topAction(ui);
  }
  if (Input.stick.id === e.pointerId) { Input.stick.id = null; Input.stick.dir = null; }
  Input.btnPointers.delete(e.pointerId);
}
canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
canvas.addEventListener('pointermove', onPointerMove, { passive: false });
canvas.addEventListener('pointerup', onPointerUp);
canvas.addEventListener('pointercancel', onPointerUp);
canvas.addEventListener('lostpointercapture', e => { if (Input.stick.id === e.pointerId || Input.btnPointers.has(e.pointerId)) onPointerUp(e); });

window.addEventListener('keydown', e => {
  Audio.init();
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  if (e.code === 'KeyM') { Game.toggleMute(); return; }
  if ((e.code === 'KeyP' || e.code === 'Escape') && Game.isPlaying()) { Game.setPaused(!Game.paused); return; }
  if (Game.isOverlayMenu() || Game.state === 'intro') { UI.menuKey(e.code); return; }
  if (!Game.isPlaying()) return;
  Input.keys.add(e.code);
  if (Input.keyMap[e.code]) Input.latch.add(Input.keyMap[e.code]);
});
window.addEventListener('keyup', e => { Input.keys.delete(e.code); });

// bloqueios de gesto do navegador
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());

// pausa automática
document.addEventListener('visibilitychange', () => { if (document.hidden) { Game.setPaused(true); Input.clear(); } });
window.addEventListener('blur', () => { Game.setPaused(true); Input.clear(); });

// redimensionamento
let resizeTimer = 0;
function scheduleResize() { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => View.resize(), 60); }
window.addEventListener('resize', scheduleResize);
window.addEventListener('orientationchange', scheduleResize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleResize);
document.addEventListener('fullscreenchange', scheduleResize);

/* ============================ Loop ============================ */
let lastT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!lastT) lastT = now;
  const dt = Math.min((now - lastT) / 1000, 1 / 30);
  lastT = now;
  Game.update(dt);
  Game.draw();
}

/* ============================ Boot ============================ */
Save.load();
Audio.muted = !!Save.data.config.mudo;
Pools.init();
Level.build(1);
Input.clear();
Player.reset(80, CONFIG.world.groundY);
View.resize();
window.__BION_UI = UI;
requestAnimationFrame(frame);
window.__BION = { Game, Player, Enemies, Input, View, CONFIG, Pools };
</script>
